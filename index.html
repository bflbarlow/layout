<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout — Page Layout Editor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232563EB%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2218%22%20height%3D%2218%22%20rx%3D%222%22%2F%3E%3Cline%20x1%3D%223%22%20y1%3D%2210%22%20x2%3D%2221%22%20y2%3D%2210%22%2F%3E%3Cline%20x1%3D%2212%22%20y1%3D%2210%22%20x2%3D%2212%22%20y2%3D%2221%22%2F%3E%3C%2Fsvg%3E">
<!-- No-flash theme detection (STYLE_GUIDE §8.1) -->
<script>
(function(){var s=localStorage.getItem('theme');var t=s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* ==========================================================================
   Ecosystem tokens (STYLE_GUIDE §2.2, §5.1, §6.1, §6.2)
   ========================================================================== */
:root {
  --color-accent:        #2563EB;
  --color-accent-hover:  #1D4ED8;
  --color-accent-soft:   #2563EB1A;

  --color-success: #16A34A;
  --color-warning: #D97706;
  --color-danger:  #DC2626;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono",
               Menlo, monospace;

  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.10);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.16);

  /* Tool-specific layout vars (prefixed --lp- to avoid collision) */
  --lp-toolbar-h: 52px;
  --lp-sidebar-w: 240px;
  --lp-statush: 28px;
  --lp-pw: 850px;
  --lp-ph: 1100px;
}

/* Light theme (default) */
:root,
[data-theme="light"] {
  --color-bg:            #FFFFFF;
  --color-bg-subtle:     #F5F5F7;
  --color-surface:       #FFFFFF;
  --color-border:        #E2E2E5;
  --color-text:          #111113;
  --color-text-muted:    #5B5B63;
  --color-text-disabled: #9A9AA1;
  --lp-bg-canvas:        #E8E8EC;
  --lp-bg-page:          #FFFFFF;
}

/* Dark theme */
[data-theme="dark"] {
  --color-bg:            #0E0E10;
  --color-bg-subtle:     #17171A;
  --color-surface:       #1C1C20;
  --color-border:        #2C2C32;
  --color-text:          #F2F2F3;
  --color-text-muted:    #A3A3AB;
  --color-text-disabled: #5B5B63;
  --lp-bg-canvas:        #252528;
  --lp-bg-page:          #FFFFFF;
}

/* Focus-visible (STYLE_GUIDE §8.4) */
:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Reduced motion (STYLE_GUIDE §9.4) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Global reset & base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior-x:none}
body{font-family:var(--font-sans);font-size:var(--text-sm);background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ==========================================================================
   Skip link (STYLE_GUIDE §9.2)
   ========================================================================== */
.skip-link {
  position: absolute;
  top: -100%;
  left: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent);
  color: #FFFFFF;
  font-size: var(--text-sm);
  font-weight: 600;
  border-radius: var(--radius-sm);
  z-index: 200;
  text-decoration: none;
}
.skip-link:focus {
  top: var(--space-4);
}

/* ==========================================================================
   Toolbar / <header>
   ========================================================================== */
.toolbar{height:var(--lp-toolbar-h);background:var(--color-bg-subtle);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-3);gap:var(--space-1);z-index:100;flex-shrink:0}
.toolbar-group{display:flex;align-items:center;gap:var(--space-1)}
.toolbar-divider{width:1px;height:28px;background:var(--color-border);margin:0 var(--space-2)}

/* Tool buttons — 44×44px min touch target (STYLE_GUIDE §7.1) */
.tool-btn{
  display:flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;
  padding:var(--space-2);
  border:none;background:transparent;color:var(--color-text-muted);
  border-radius:var(--radius-sm);cursor:pointer;transition:all .15s
}
.tool-btn:hover{background:var(--color-border);color:var(--color-text)}
.tool-btn.active{background:var(--color-accent);color:#FFFFFF}
.tool-btn.primary{background:var(--color-accent);color:#FFFFFF;padding:var(--space-2) var(--space-4);width:auto;gap:var(--space-2);font-weight:500}
.tool-btn.primary:hover{background:var(--color-accent-hover)}
.tool-btn:disabled{color:var(--color-text-disabled);cursor:not-allowed;opacity:1}

/* Text toolbar controls (removed — now in properties panel) */

/* ==========================================================================
   Main layout
   ========================================================================== */
.main-layout{flex:1;display:flex;overflow:hidden;min-height:0}

/* ==========================================================================
   Sidebars
   ========================================================================== */
.sidebar{background:var(--color-bg-subtle);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-left{width:var(--lp-sidebar-w);border-right:1px solid var(--color-border)}
.sidebar-right{width:var(--lp-sidebar-w);border-left:1px solid var(--color-border);position:relative}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-border)}
.sidebar-header h3{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-disabled);font-weight:600}

/* Sidebar add page button — 44×44px touch target */
.sidebar-add-btn{
  min-width:44px;min-height:44px;
  border:1px solid var(--color-border);background:var(--color-surface);
  color:var(--color-text-muted);border-radius:var(--radius-sm);cursor:pointer;
  font-size:var(--text-lg);display:flex;align-items:center;justify-content:center
}
.sidebar-add-btn:hover{border-color:var(--color-accent);color:var(--color-accent)}

/* Page list & thumbnails */
.page-list{flex:1;overflow-y:auto;padding:var(--space-2)}
.page-thumb{background:var(--lp-bg-page);border:1px solid transparent;border-radius:var(--radius-sm);margin-bottom:var(--space-2);cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.page-thumb:hover{border-color:var(--color-border);box-shadow:var(--shadow-sm)}
.page-thumb.active{border-color:var(--color-accent)}
.page-thumb-canvas{width:100%;aspect-ratio:.7727;position:relative;background:#fff}
.page-thumb-label{padding:var(--space-1) var(--space-2);text-align:center;font-size:var(--text-xs);color:var(--color-text-disabled);background:var(--color-surface)}
.page-thumb .delete-page-btn{
  position:absolute;top:2px;right:2px;
  min-width:44px;min-height:44px;
  /* Visually smaller button padded to 44×44px touch target */
  width:24px;height:24px;
  background:var(--color-danger);color:#FFFFFF;
  border:none;border-radius:50%;
  font-size:14px;cursor:pointer;display:none;
  align-items:center;justify-content:center;line-height:1;
  /* Expand invisible hit area to 44×44px */
  padding:10px;
  background-clip:content-box;
}
.page-thumb:hover .delete-page-btn{display:flex}

/* ==========================================================================
   Sidebar resize handle
   ========================================================================== */
#sidebar-resize-handle {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8px;
  cursor: col-resize;
  z-index: 110;
  background: transparent;
  transition: background 0.15s;
}
#sidebar-resize-handle:hover,
#sidebar-resize-handle.active {
  background: var(--color-accent-soft);
}
#sidebar-resize-handle::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 40px;
  border-radius: 2px;
  background: var(--color-border);
  opacity: 0;
  transition: opacity 0.15s, background 0.15s;
}
#sidebar-resize-handle:hover::after,
#sidebar-resize-handle.active::after {
  opacity: 1;
  background: var(--color-accent);
}

/* ==========================================================================
   Sidebar collapse button
   ========================================================================== */
.sidebar-collapse-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-accent-soft);
  border: 1px solid var(--color-accent);
  color: var(--color-accent);
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  margin: var(--space-2) var(--space-2) var(--space-2) auto;
  flex-shrink: 0;
  transition: all 0.15s;
  padding: 0;
}
.sidebar-collapse-btn:hover {
  background: var(--color-accent);
  color: #FFFFFF;
  border-color: var(--color-accent);
}
.sidebar-collapse-btn svg {
  width: 16px;
  height: 16px;
  display: block;
  transition: transform 0.2s;
}

/* ==========================================================================
   Collapsed state — sidebar-right
   ========================================================================== */
#sidebar-right.collapsed {
  width: 40px !important;
  min-width: 40px;
}
#sidebar-right.collapsed .sidebar-tabs-wrap {
  justify-content: center;
  border-bottom: none;
}
#sidebar-right.collapsed .sidebar-tabs,
#sidebar-right.collapsed .tab-content,
#sidebar-right.collapsed .sidebar-header,
#sidebar-right.collapsed .page-list,
#sidebar-right.collapsed #sidebar-resize-handle {
  display: none;
}
#sidebar-right.collapsed .sidebar-collapse-btn {
  margin: var(--space-2);
  width: 28px;
  height: 28px;
}

/* ==========================================================================
   Sidebar tabs wrap (contains tabs + collapse button)
   ========================================================================== */
.sidebar-tabs-wrap {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
}

/* ==========================================================================
   Sidebar tabs
   ========================================================================== */
.sidebar-tabs{display:flex;flex:1}
.tab-btn{flex:1;padding:var(--space-2);border:none;background:transparent;color:var(--color-text-disabled);cursor:pointer;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:2px solid transparent;transition:all .15s;min-height:44px}
.tab-btn:hover{color:var(--color-text-muted)}
.tab-btn.active{color:var(--color-accent);border-bottom-color:var(--color-accent)}
.tab-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{display:none;flex:1;overflow-y:auto;padding:var(--space-3)}
.tab-panel.active{display:block}
.panel-section{margin-bottom:var(--space-4)}
.panel-toggle{display:flex;align-items:center;gap:4px;width:100%;background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;margin-bottom:var(--space-2)}
.panel-toggle h4{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-disabled);font-weight:600;margin:0}
.panel-toggle .chevron{width:12px;height:12px;color:var(--color-text-disabled);transition:transform .15s;flex-shrink:0}
.panel-section.collapsed .panel-toggle .chevron{transform:rotate(-90deg)}
.panel-section.collapsed .panel-body{display:none}
.prop-row{display:flex;gap:var(--space-2);margin-bottom:var(--space-2);align-items:center}
.prop-row label{display:flex;align-items:center;gap:var(--space-1);flex:1;font-size:var(--text-xs);color:var(--color-text-muted)}
.prop-row label input,.prop-row label select,.prop-row label textarea{flex:1;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:var(--text-base);min-height:44px}
.prop-row label input[type=color]{flex:0;min-width:44px;min-height:44px;cursor:pointer}
.prop-row label textarea{resize:vertical;font-family:inherit}
.prop-row label select{cursor:pointer}

/* --------------- Rich Text Editor --------------- */
.rte-toolbar{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:4px;margin-bottom:4px;background:var(--color-bg-subtle);border:1px solid var(--color-border);border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.rte-btn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;min-height:26px;padding:0 4px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--color-text);font-size:12px;cursor:pointer;line-height:1}
.rte-btn:hover{background:var(--color-surface);border-color:var(--color-border)}
.rte-btn:active,.rte-btn.active{background:var(--color-primary);color:#fff}
.rte-sep{display:inline-block;width:1px;height:18px;margin:0 2px;background:var(--color-border)}
.rte-font-row{display:flex;gap:4px;align-items:center;padding:4px;background:var(--color-bg-subtle);border:1px solid var(--color-border);border-top:none;border-bottom:none}
.rte-font-row select,.rte-font-row input{flex:1;min-width:0;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:2px 4px;border-radius:3px;font-size:11px;min-height:28px}
.rte-area{display:block;width:100%;min-height:150px;max-height:400px;overflow-y:auto;padding:8px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:0 0 var(--radius-sm) var(--radius-sm);color:var(--color-text);font-size:13px;line-height:1.5;outline:none;resize:vertical;font-family:inherit;box-sizing:border-box}
.rte-area:focus{border-color:var(--color-primary);box-shadow:0 0 0 2px rgba(45,126,255,.2)}
.rte-subhead{font-size:10px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px;padding:0;font-weight:600}
.small-btn{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-muted);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-xs);min-height:44px}
.small-btn:hover{border-color:var(--color-accent);color:var(--color-accent)}

/* Layers panel */
.layer-list{display:flex;flex-direction:column;gap:var(--space-1)}
.layer-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-2);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-xs);color:var(--color-text-muted);transition:all .1s;min-height:44px}
.layer-item:hover{background:var(--color-border)}
.layer-item.active{background:var(--color-accent-soft);color:var(--color-accent)}
.layer-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.layer-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-visibility{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.4;border-radius:var(--radius-sm)}
.layer-visibility:hover{opacity:.8}
.layer-visibility.hidden{opacity:.2}

/* ==========================================================================
   Canvas area
   ========================================================================== */
.canvas-area{flex:1;overflow:hidden;background:var(--lp-bg-canvas);position:relative}
.canvas-scroll{width:100%;height:100%;overflow:hidden;position:relative;touch-action:none;overscroll-behavior-x:none}
.canvas-container{position:relative;display:inline-block;padding:var(--space-7);touch-action:none;overscroll-behavior-x:none}
.ruler-h{position:absolute;top:-24px;left:0;width:var(--lp-pw);height:24px;background:var(--color-bg-subtle);border-bottom:1px solid var(--color-border);pointer-events:none;transform-origin:0 0}
.ruler-v{position:absolute;top:0;left:-24px;height:var(--lp-ph);width:24px;background:var(--color-bg-subtle);border-right:1px solid var(--color-border);pointer-events:none;transform-origin:0 0}
.ruler-mark{position:absolute;background:var(--color-text-disabled)}
.canvas-page{width:var(--lp-pw);min-height:var(--lp-ph);background:var(--lp-bg-page);box-shadow:var(--shadow-md);position:relative;margin-left:24px;margin-top:24px;transform-origin:0 0}
.page-content{position:relative;width:100%;height:100%;min-height:var(--lp-ph);z-index:1}
.grid-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.canvas-element{position:absolute;cursor:move;border:1px solid transparent;transition:box-shadow .1s}
.canvas-element:hover{border-color:var(--color-accent-soft)}
.canvas-element.selected{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent)}
.resize-handle{position:absolute;width:10px;height:10px;background:var(--color-surface);border:1.5px solid var(--color-accent);border-radius:2px;z-index:10}
.resize-handle.nw{top:-5px;left:-5px;cursor:nw-resize}
.resize-handle.ne{top:-5px;right:-5px;cursor:ne-resize}
.resize-handle.sw{bottom:-5px;left:-5px;cursor:sw-resize}
.resize-handle.se{bottom:-5px;right:-5px;cursor:se-resize}
.resize-handle.n{top:-5px;left:50%;margin-left:-5px;cursor:n-resize}
.resize-handle.s{bottom:-5px;left:50%;margin-left:-5px;cursor:s-resize}
.resize-handle.w{top:50%;left:-5px;margin-top:-5px;cursor:w-resize}
.resize-handle.e{top:50%;right:-5px;margin-top:-5px;cursor:e-resize}
.el-text{white-space:pre-wrap;word-break:break-word;min-width:20px;min-height:20px}
.el-image{overflow:hidden}
.el-image img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.selection-ghost{position:absolute;border:1.5px dashed var(--color-accent);pointer-events:none;z-index:50}

/* ==========================================================================
   Status bar
   ========================================================================== */
.status-bar{height:var(--lp-statush);background:var(--color-bg-subtle);border-top:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-3);font-size:var(--text-xs);color:var(--color-text-disabled);gap:var(--space-4);flex-shrink:0}
#status-tool{color:var(--color-accent);font-weight:500}

/* ==========================================================================
   Scrollbar styling
   ========================================================================== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--color-bg)}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:var(--radius-sm)}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-disabled)}

/* ==========================================================================
   WIP banner
   ========================================================================== */
.lp-wip-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-xs);
  color: var(--color-text);
  background: var(--color-warning);
  flex-shrink: 0;
}
.lp-wip-banner .lp-wip-close {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  padding: var(--space-1);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.8;
}
.lp-wip-banner .lp-wip-close:hover { opacity: 1; }

/* ==========================================================================
   Brand / About link in toolbar
   ========================================================================== */
.lp-brand {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-accent);
  padding: 0 var(--space-3);
  cursor: pointer;
  user-select: none;
  letter-spacing: -0.5px;
  white-space: nowrap;
  text-decoration: none;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: var(--space-1);
}
.lp-brand:hover {
  color: var(--color-accent-hover);
}
.lp-version{font-size:10px;font-weight:400;color:var(--color-text-disabled);margin-left:2px;align-self:flex-end;padding-bottom:2px;}

/* ==========================================================================
   Toast notification (STYLE_GUIDE §7.5)
   ========================================================================== */
.lp-toast-container {
  position: fixed;
  bottom: var(--space-5);
  right: var(--space-5);
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
}
.lp-toast {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-sm);
  color: var(--color-text);
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  max-width: 360px;
  animation: lp-toast-in .2s ease;
}
.lp-toast.lp-toast-error {
  border-color: var(--color-danger);
}
.lp-toast .lp-toast-close {
  background: none;
  border: none;
  color: var(--color-text-disabled);
  cursor: pointer;
  padding: var(--space-1);
  min-width: 32px;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  margin-left: auto;
}
.lp-toast .lp-toast-close:hover {
  color: var(--color-text);
  background: var(--color-bg-subtle);
}
@keyframes lp-toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   Confirmation dialog (STYLE_GUIDE §7.5)
   ========================================================================== */
.lp-confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 400;
}
.lp-confirm-dialog {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  max-width: 400px;
  width: 90%;
  box-shadow: var(--shadow-lg);
}
.lp-confirm-dialog h3 {
  font-size: var(--text-base);
  font-weight: 600;
  margin-bottom: var(--space-2);
}
.lp-confirm-dialog p {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  margin-bottom: var(--space-4);
  line-height: 1.5;
}
.lp-confirm-actions {
  display: flex;
  gap: var(--space-2);
  justify-content: flex-end;
}
.lp-confirm-actions button {
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  cursor: pointer;
  min-height: 44px;
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-text);
}
.lp-confirm-actions .lp-confirm-delete {
  background: var(--color-danger);
  color: #FFFFFF;
  border-color: var(--color-danger);
}
.lp-confirm-actions .lp-confirm-delete:hover {
  opacity: .9;
}

/* Character picker popup */
.lp-char-popup {
  position: fixed;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-3);
  box-shadow: var(--shadow-lg);
  z-index: 500;
  max-width: 380px;
}
.lp-char-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 2px;
}
.lp-char-grid button {
  width: 32px;
  height: 32px;
  font-size: 16px;
  border: 1px solid var(--color-border);
  background: var(--color-bg-subtle);
  color: var(--color-text);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .1s;
}
.lp-char-grid button:hover {
  background: var(--color-accent);
  color: #FFFFFF;
  border-color: var(--color-accent);
}

/* Find & Replace modal */
.lp-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 350;
}
.lp-modal {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  max-width: 440px;
  width: 90%;
  box-shadow: var(--shadow-lg);
}
.lp-modal h3 {
  font-size: var(--text-base);
  font-weight: 600;
  margin-bottom: var(--space-3);
}
.lp-modal-body .prop-row {
  margin-bottom: var(--space-2);
}
.lp-modal-actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-top: var(--space-4);
}
.lp-modal-actions .small-btn {
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-xs);
  border: 1px solid var(--color-border);
  background: var(--color-bg-subtle);
  color: var(--color-text);
  border-radius: var(--radius-sm);
  cursor: pointer;
  min-height: 36px;
}

/* Drop cap */
.drop-cap::first-letter {
  float: left;
  font-size: 3em;
  line-height: 0.8;
  padding-right: 6px;
  padding-top: 4px;
  font-weight: 700;
}

/* ==========================================================================
   Spinner (STYLE_GUIDE §7.5)
   ========================================================================== */
.lp-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: lp-spin .6s linear infinite;
}
@keyframes lp-spin {
  to { transform: rotate(360deg); }
}

/* ==========================================================================
   Responsive (STYLE_GUIDE §9.6)
   ========================================================================== */
@media (max-width: 1100px) {
  :root { --lp-sidebar-w: 200px; }
}
@media (max-width: 800px) {
  .sidebar-left { display: none; }
  :root { --lp-sidebar-w: 180px; }
}
@media (max-width: 600px) {
  .sidebar-right { display: none; }
  .toolbar { flex-wrap: wrap; height: auto; min-height: var(--lp-toolbar-h); padding: var(--space-1) var(--space-2); gap: var(--space-1); }
}
@media (max-width: 480px) {
  .toolbar-group .tool-btn { min-width: 36px; min-height: 36px; padding: var(--space-1); }
}
</style>

<!-- =========================================================================
     Toast container
     ========================================================================= -->
<div class="lp-toast-container" id="lp-toast-container" aria-live="polite"></div>

<script>
(function() {
'use strict';

/* ================================================================
   Layout — Page Layout Editor
   Single-file application JS
   ================================================================ */

var PW = 850, PH = 1100, GRID = 10, MAX_UNDO = 50, SAVE_DELAY = 1500, SK = 'layout-editor-data';
var $ = function(id) { return document.getElementById(id); };
var timer = null;

/* --------------- Toast system (STYLE_GUIDE §7.5) --------------- */
function showToast(message, type) {
  var container = $('lp-toast-container');
  if (!container) return;
  var t = document.createElement('div');
  t.className = 'lp-toast' + (type === 'error' ? ' lp-toast-error' : '');
  t.textContent = message;
  var close = document.createElement('button');
  close.className = 'lp-toast-close';
  close.setAttribute('aria-label', 'Dismiss notification');
  close.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  close.addEventListener('click', function() { t.remove(); });
  t.appendChild(close);
  container.appendChild(t);
  var timeout = setTimeout(function() { if (t.parentNode) t.remove(); }, 5000);
  t.addEventListener('mouseenter', function() { clearTimeout(timeout); });
  t.addEventListener('mouseleave', function() {
    timeout = setTimeout(function() { if (t.parentNode) t.remove(); }, 5000);
  });
  // Allow screen reader announcement via aria-live
}

/* --------------- Confirmation dialog (STYLE_GUIDE §7.5) --------------- */
function confirmDialog(message, confirmLabel, callback) {
  var overlay = document.createElement('div');
  overlay.className = 'lp-confirm-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-labelledby', 'confirm-title');

  overlay.innerHTML =
    '<div class="lp-confirm-dialog">' +
    '  <h3 id="confirm-title">' + message + '</h3>' +
    '  <p>This action cannot be undone.</p>' +
    '  <div class="lp-confirm-actions">' +
    '    <button class="lp-confirm-cancel" data-action="cancel">Cancel</button>' +
    '    <button class="lp-confirm-delete" data-action="confirm">' + confirmLabel + '</button>' +
    '  </div>' +
    '</div>';

  document.body.appendChild(overlay);

  // Focus management
  var firstBtn = overlay.querySelector('.lp-confirm-cancel');
  var lastBtn = overlay.querySelector('.lp-confirm-delete');
  if (firstBtn) firstBtn.focus();

  overlay.addEventListener('keydown', function trap(e) {
    if (e.key === 'Escape') { overlay.remove(); return; }
    if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === firstBtn) { e.preventDefault(); lastBtn.focus(); }
      else if (!e.shiftKey && document.activeElement === lastBtn) { e.preventDefault(); firstBtn.focus(); }
    }
  });

  overlay.querySelectorAll('button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      overlay.remove();
      if (this.dataset.action === 'confirm' && callback) callback();
    });
  });
}

/* --------------- State --------------- */
var state = {
  pages: [],
  currentPageIndex: 0,
  zoom: 1,
  panX: 0,
  panY: 0,
  minZoom: 0.1,
  maxZoom: 4,
  tool: 'select',
  selectedElements: [],
  undoStack: [],
  redoStack: [],
  dirty: false,
  isPanning: false,
  panStart: null,
  pointers: {},
  pinchStart: null,
  showGrid: true
};

var subs = [];

function emit() {
  subs.forEach(function(f) { f(); });
}

function on(f) {
  subs.push(f);
}

function gid() {
  return 'e' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

function snap(v) {
  return Math.round(v / GRID) * GRID;
}

/* --------------- Coordinate helpers (zoom/pan aware) --------------- */
function toCanvas(cx, cy) {
  var ct = $('page-content');
  if (!ct) return { x: 0, y: 0 };
  var r = ct.getBoundingClientRect();
  return {
    x: (cx - r.left) / state.zoom,
    y: (cy - r.top) / state.zoom
  };
}

function pageCoords(e) {
  return toCanvas(e.clientX, e.clientY);
}

function applyTransform() {
  var pc = $('canvas-page');
  if (!pc) return;
  var t = 'translate(' + state.panX + 'px, ' + state.panY + 'px) scale(' + state.zoom + ')';
  pc.style.transform = t;
  $('zoom-label').textContent = Math.round(state.zoom * 100) + '%';
}

/* --------------- Grid --------------- */
function renderGrid() {
  var g = $('grid-layer');
  if (!g) return;
  var p = cpage();
  var cw = p ? (p.pw || PW) : PW, ch = p ? (p.ph || PH) : PH;
  var cc = '#FFFFFF';
  if (document.documentElement.getAttribute('data-theme') === 'dark') cc = '#1C1C20';
  var gridLines = '';
  for (var x = 0; x <= cw; x += GRID) {
    gridLines += '<path d="M' + x + ' 0 L' + x + ' ' + ch + '" stroke="' + (x % 50 === 0 ? '#D0D0D4' : '#E8E8EC') + '" stroke-width="1"/>';
  }
  for (var y = 0; y <= ch; y += GRID) {
    gridLines += '<path d="M0 ' + y + ' L' + cw + ' ' + y + '" stroke="' + (y % 50 === 0 ? '#D0D0D4' : '#E8E8EC') + '" stroke-width="1"/>';
  }
  g.innerHTML = '<svg width="' + cw + '" height="' + ch + '" style="display:block">' + gridLines + '</svg>';
}

function cpage() {
  return state.pages[state.currentPageIndex];
}

function saveSnapshot() {
  state.undoStack.push(JSON.stringify(state.pages));
  if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
  state.redoStack = [];
  state.dirty = true;
}

/* --------------- Pages --------------- */
function mkPage(idx) {
  return {
    id: 'p' + Date.now().toString(36) + '_' + idx,
    elements: [],
    name: 'Page ' + (idx + 1),
    pw: PW,
    ph: PH
  };
}

function addPage() {
  var i = state.pages.length;
  state.pages.push(mkPage(i));
  state.currentPageIndex = i;
  state.selectedElements = [];
  saveSnapshot();
  emit();
}

function removePage(idx) {
  if (state.pages.length <= 1) {
    showToast('Cannot delete the last page.', 'error');
    return;
  }
  confirmDialog('Delete this page?', 'Delete', function() {
    state.pages.splice(idx, 1);
    if (state.currentPageIndex >= state.pages.length) {
      state.currentPageIndex = state.pages.length - 1;
    }
    state.selectedElements = [];
    saveSnapshot();
    emit();
  });
}

function switchPage(idx) {
  if (idx >= 0 && idx < state.pages.length) {
    state.currentPageIndex = idx;
    state.selectedElements = [];
    emit();
  }
}

/* --------------- Elements --------------- */
function mkEl(type, opts) {
  var o = opts || {};
  var b = {
    id: gid(),
    type: type,
    x: o.x || 50,
    y: o.y || 50,
    w: o.w || 100,
    h: o.h || 100,
    fill: o.fill || (type === 'image' ? 'transparent' : '#FFFFFF'),
    fillOpacity: o.fillOpacity != null ? o.fillOpacity : 100,
    stroke: o.stroke || '#111113',
    strokeOpacity: o.strokeOpacity != null ? o.strokeOpacity : 100,
    strokeWidth: o.strokeWidth != null ? o.strokeWidth : 1,
    opacity: o.opacity != null ? o.opacity : 100,
    radius: o.radius || 0,
    rotation: o.rotation || 0,
    visible: true,
    name: type.charAt(0).toUpperCase() + type.slice(1) + ' ' + Math.floor(Math.random() * 100)
  };
  if (type === 'text') {
    b.text = o.text || 'Text';
    b.richText = o.richText || b.text;
    b.fontFamily = o.fontFamily || 'Georgia, serif';
    b.fontSize = o.fontSize || 16;
    b.fontWeight = o.fontWeight || '400';
    b.textAlign = o.textAlign || 'left';
    b.textColor = o.textColor || '#111113';
    b.lineHeight = o.lineHeight || 1.5;
    b.letterSpacing = o.letterSpacing || 0;
    b.padding = o.padding || 8;
    b.verticalAlign = o.verticalAlign || 'top';
    b.overflow = o.overflow || 'clip';
    b.paraSpacing = o.paraSpacing || 0;
    b.textIndent = o.textIndent || 0;
    b.columnCount = o.columnCount || 1;
    b.columnGap = o.columnGap || 20;
    b.dir = o.dir || 'ltr';
    b.autoResize = o.autoResize || false;
    b.minH = o.minH || 0;
    b.maxH = o.maxH || 0;
    b.dropCap = o.dropCap || false;
    b.hyphens = o.hyphens || false;
  }
  if (type === 'image') b.src = o.src || '';
  if (type === 'line') {
    b.x2 = o.x2 || b.x + 100;
    b.y2 = o.y2 || b.y;
  }
  return b;
}

function addElement(type, opts) {
  var p = cpage();
  if (!p) return null;
  var el = mkEl(type, opts);
  p.elements.push(el);
  saveSnapshot();
  emit();
  return el;
}

function getEl(id) {
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        return { el: state.pages[i].elements[j], page: state.pages[i] };
      }
    }
  }
  return null;
}

function updEl(id, patch) {
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        for (var k in patch) {
          if (patch.hasOwnProperty(k)) {
            state.pages[i].elements[j][k] = patch[k];
          }
        }
        return true;
      }
    }
  }
  return false;
}

function removeElement(id) {
  var sel = state.selectedElements;
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        state.pages[i].elements.splice(j, 1);
        state.selectedElements = sel.filter(function(x) { return x !== id; });
        saveSnapshot();
        emit();
        return true;
      }
    }
  }
  return false;
}

function dupElement(id) {
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        var clone = JSON.parse(JSON.stringify(state.pages[i].elements[j]));
        clone.id = gid();
        clone.x += 20;
        clone.y += 20;
        clone.name += ' copy';
        state.pages[i].elements.splice(j + 1, 0, clone);
        saveSnapshot();
        emit();
        return clone;
      }
    }
  }
  return null;
}

function bringForward(id) {
  for (var i = 0; i < state.pages.length; i++) {
    var es = state.pages[i].elements;
    for (var j = 0; j < es.length; j++) {
      if (es[j].id === id && j < es.length - 1) {
        es.push(es.splice(j, 1)[0]);
        saveSnapshot();
        emit();
        return true;
      }
    }
  }
  return false;
}

function sendBackward(id) {
  for (var i = 0; i < state.pages.length; i++) {
    var es = state.pages[i].elements;
    for (var j = 0; j < es.length; j++) {
      if (es[j].id === id && j > 0) {
        es.unshift(es.splice(j, 1)[0]);
        saveSnapshot();
        emit();
        return true;
      }
    }
  }
  return false;
}

function align(how) {
  var p = cpage();
  if (!p || state.selectedElements.length < 2) return;
  var pw = p.pw || PW, ph = p.ph || PH;
  p.elements.forEach(function(el) {
    if (state.selectedElements.indexOf(el.id) === -1) return;
    if (how === 'left') {
      var minX = Infinity;
      state.selectedElements.forEach(function(id) {
        var found = null;
        for (var k = 0; k < p.elements.length; k++) {
          if (p.elements[k].id === id) { found = p.elements[k]; break; }
        }
        if (found) minX = Math.min(minX, found.x);
      });
      el.x = minX;
    } else if (how === 'center') {
      el.x = Math.round(pw / 2 - el.w / 2);
    } else if (how === 'right') {
      var maxX = 0;
      state.selectedElements.forEach(function(id) {
        var found = null;
        for (var k = 0; k < p.elements.length; k++) {
          if (p.elements[k].id === id) { found = p.elements[k]; break; }
        }
        if (found) maxX = Math.max(maxX, found.x + found.w);
      });
      el.x = maxX - el.w;
    }
  });
  saveSnapshot();
  emit();
}

function select(id, add) {
  if (add) {
    if (state.selectedElements.indexOf(id) === -1) state.selectedElements.push(id);
  } else {
    state.selectedElements = [id];
  }
  emit();
}

function deselect() {
  state.selectedElements = [];
  emit();
}

function undo() {
  if (state.undoStack.length <= 1) return;
  state.redoStack.push(state.undoStack.pop());
  state.pages = JSON.parse(state.undoStack[state.undoStack.length - 1]);
  state.selectedElements = [];
  emit();
}

function redo() {
  if (state.redoStack.length === 0) return;
  var next = state.redoStack.pop();
  state.undoStack.push(next);
  state.pages = JSON.parse(next);
  state.selectedElements = [];
  emit();
}

/* --------------- Persistence --------------- */
function save() {
  try {
    localStorage.setItem('lp-zoom', String(state.zoom));
    localStorage.setItem('lp-panX', String(state.panX));
    localStorage.setItem('lp-panY', String(state.panY));
    var d = { v: 1, ts: new Date().toISOString(), pages: state.pages, idx: state.currentPageIndex };
    localStorage.setItem(SK, JSON.stringify(d));
  } catch (e) {
    showToast('Could not save to local storage. Storage may be full.', 'error');
  }
}

function load() {
  try {
    var raw = localStorage.getItem(SK);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (d && d.pages && Array.isArray(d.pages)) {
      /* Migrate: ensure all pages have pw/ph */
      d.pages.forEach(function(pg) {
        if (pg.pw == null) pg.pw = PW;
        if (pg.ph == null) pg.ph = PH;
      });
      return d;
    }
  } catch (e) {
    return null;
  }
}

function autosave() {
  if (!state.dirty) return;
  clearTimeout(timer);
  timer = setTimeout(function() {
    save();
    state.dirty = false;
  }, SAVE_DELAY);
}

/* --------------- Export --------------- */
function exportHTML() {
  /* Collect fonts used in the document */
  var fonts = [];
  state.pages.forEach(function(pg) {
    pg.elements.forEach(function(el) {
      if (el.type === 'text' && el.fontFamily) {
        var f = el.fontFamily.split(',')[0].replace(/['"]/g, '').trim();
        if (fonts.indexOf(f) === -1 && f !== 'system-ui' && f !== 'inherit') fonts.push(f);
      }
    });
  });
  var fontLink = '';
  if (fonts.length > 0) {
    fontLink = '<link href="https://fonts.googleapis.com/css2?' + fonts.map(function(f) { return 'family=' + encodeURIComponent(f) + ':wght@400;700'; }).join('&') + '&display=swap" rel="stylesheet">\n';
  }
  var h = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n' + fontLink + '<style>\n';
  h += 'body{margin:0;font-family:sans-serif;}\n';
  h += '.page{position:relative;background:white;overflow:hidden;page-break-after:always;margin:0 auto;}\n';
  h += '.page>*{position:absolute;}\n';
  h += '.drop-cap::first-letter{float:left;font-size:3em;line-height:.8;padding-right:6px;padding-top:4px;font-weight:700;}\n';
  h += '</style>\n</head>\n<body>\n';
  state.pages.forEach(function(pg) {
    var pw = pg.pw || PW, ph = pg.ph || PH;
    h += '<div class="page" style="width:' + pw + 'px;height:' + ph + 'px">\n';
    pg.elements.forEach(function(el) {
      if (!el.visible) return;
      var s = 'left:' + el.x + 'px;top:' + el.y + 'px;width:' + el.w + 'px;height:' + el.h + 'px;';
      s += 'opacity:' + (el.opacity / 100) + ';border-radius:' + el.radius + 'px;';
      if (el.rotation) s += 'transform:rotate(' + el.rotation + 'deg);';
      if (el.type === 'text') {
        s += 'color:' + el.textColor + ';font-family:' + el.fontFamily + ';font-size:' + el.fontSize + 'px;font-weight:' + el.fontWeight + ';text-align:' + el.textAlign + ';line-height:' + (el.lineHeight || 1.5) + ';letter-spacing:' + (el.letterSpacing || 0) + 'px;padding:' + (el.padding != null ? el.padding : 8) + 'px;text-indent:' + (el.textIndent || 0) + 'px;display:flex;flex-direction:column;justify-content:' + (el.verticalAlign === 'middle' ? 'center' : el.verticalAlign === 'bottom' ? 'flex-end' : 'flex-start') + ';overflow:' + (el.overflow === 'visible' ? 'visible' : el.overflow === 'scroll' ? 'auto' : 'hidden') + ';column-count:' + (el.columnCount || 1) + ';' + (el.columnCount > 1 ? 'column-gap:' + (el.columnGap || 20) + 'px;' : '') + (el.hyphens ? 'hyphens:auto;' : '') + 'background:' + rgba(el.fill, el.fillOpacity) + ';';
      } else if (el.type === 'line') {
        s += 'width:' + (el.x2 - el.x) + 'px;border-top:' + el.strokeWidth + 'px solid ' + rgba(el.stroke, el.strokeOpacity) + ';height:0;';
      }
      var extra = el.type === 'image' ? ' src="' + el.src + '"' : '';
      var inner = el.type === 'text' ? (el.richText || el.text) : '';
      if (el.type === 'image') {
        h += '  <img style="' + s + '"' + extra + ' />\n';
      } else {
        var dirAttr = el.type === 'text' && el.dir ? ' dir="' + el.dir + '"' : '';
        var dropCapClass = el.type === 'text' && el.dropCap ? ' class="drop-cap"' : '';
        h += '  <div style="' + s + '"' + extra + dirAttr + dropCapClass + '>' + inner + '</div>\n';
      }
    });
    h += '</div>\n';
  });
  h += '</body>\n</html>';
  return h;
}

/* --------------- Render Helpers --------------- */
function rgba(color, opacity) {
  if (!color || color === 'transparent' || opacity >= 100) return color;
  var o = Math.max(0, Math.min(100, opacity)) / 100;
  var hex = color.replace('#', '');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r = parseInt(hex.substr(0,2), 16);
  var g = parseInt(hex.substr(2,2), 16);
  var b = parseInt(hex.substr(4,2), 16);
  return 'rgba('+r+','+g+','+b+','+o+')';
}

}

function domEl(el, i) {
  var d = document.createElement('div');
  d.className = 'canvas-element';
  if (el.type === 'text') d.classList.add('el-text');
  else if (el.type === 'image') d.classList.add('el-image');
  d.dataset.id = el.id;
  d.style.left = el.x + 'px';
  d.style.top = el.y + 'px';
  d.style.width = el.w + 'px';
  d.style.height = el.h + 'px';
  d.style.opacity = (el.opacity / 100);
  d.style.zIndex = i + 1;
  if (!el.visible) d.style.display = 'none';
  /* Rotation */
  if (el.rotation) d.style.transform = 'rotate(' + el.rotation + 'deg)';

  if (el.type === 'text') {
    d.innerHTML = el.richText || el.text;
    d.spellcheck = true;
    d.style.fontFamily = el.fontFamily;
    d.style.fontSize = el.fontSize + 'px';
    d.style.fontWeight = el.fontWeight;
    d.style.textAlign = el.textAlign;
    d.style.lineHeight = el.lineHeight || 1.5;
    d.style.letterSpacing = (el.letterSpacing || 0) + 'px';
    d.style.padding = (el.padding != null ? el.padding : 8) + 'px';
    d.style.display = 'flex';
    d.style.flexDirection = 'column';
    d.style.justifyContent = el.verticalAlign === 'middle' ? 'center' : el.verticalAlign === 'bottom' ? 'flex-end' : 'flex-start';
    d.style.overflow = el.overflow === 'visible' ? 'visible' : el.overflow === 'scroll' ? 'auto' : 'hidden';
    d.style.textIndent = (el.textIndent || 0) + 'px';
    d.style.columnCount = el.columnCount || 1;
    if (el.columnCount > 1) d.style.columnGap = (el.columnGap || 20) + 'px';
    d.dir = el.dir || 'ltr';
    if (el.hyphens) d.style.hyphens = 'auto';
    if (el.dropCap) d.classList.add('drop-cap');
    /* Apply paragraph spacing to child p/div elements */
    if (el.paraSpacing > 0) {
      var ps = el.paraSpacing + 'px';
      [].forEach.call(d.querySelectorAll('p,div'), function(c) { c.style.marginBottom = ps; });
    }
    d.style.color = el.textColor;
    d.style.background = rgba(el.fill, el.fillOpacity);
    d.style.border = el.strokeWidth > 0 ? el.strokeWidth + 'px solid ' + rgba(el.stroke, el.strokeOpacity) : 'none';
    d.style.borderRadius = el.radius + 'px';
  } else if (el.type === 'line') {
    d.style.background = 'transparent';
    d.style.borderTop = el.strokeWidth + 'px solid ' + rgba(el.stroke, el.strokeOpacity);
    d.style.width = (el.x2 - el.x) + 'px';
    d.style.height = '0px';
    d.style.top = el.y + 'px';
  } else if (el.type === 'image') {
    d.style.background = el.fill;
    d.style.borderRadius = el.radius + 'px';
    if (el.src) {
      var img = document.createElement('img');
      img.src = el.src;
      img.draggable = false;
      img.alt = '';
      d.appendChild(img);
    }
  }
  return d;
}

function drawThumb(canvas, pg) {
  var ctx = canvas.getContext('2d');
  var pw = pg.pw || PW, ph = pg.ph || PH;
  var cw = canvas.width, ch = canvas.height;
  var s = Math.min(cw / pw, ch / ph);
  var ox = (cw - pw * s) / 2, oy = (ch - ph * s) / 2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cw, ch);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox, oy, pw * s, ph * s);
  pg.elements.forEach(function(el) {
    if (!el.visible) return;
    ctx.globalAlpha = el.opacity / 100;
    if (el.type === 'text') {
      ctx.fillStyle = el.textColor;
      ctx.font = (el.fontSize * s) + 'px ' + el.fontFamily;
      var txt = el.text;
      if (el.richText) txt = el.richText.replace(/<[^>]*>/g, '');
      txt = (txt || '').substring(0, 30);
      ctx.fillText(txt, ox + el.x * s, oy + el.y * s + el.fontSize * s * 0.8);
    } else if (el.type === 'rect' || el.type === 'circle') {
      ctx.fillStyle = el.fill;
      ctx.fillRect(ox + el.x * s, oy + el.y * s, el.w * s, el.h * s);
    } else if (el.type === 'line') {
      ctx.strokeStyle = el.stroke;
      ctx.lineWidth = el.strokeWidth;
      ctx.beginPath();
      ctx.moveTo(ox + el.x * s, oy + el.y * s);
      ctx.lineTo(ox + el.x2 * s, oy + el.y2 * s);
      ctx.stroke();
    } else if (el.type === 'image' && el.src) {
      /* Simple rect placeholder */
      ctx.fillStyle = '#ccc';
      ctx.fillRect(ox + el.x * s, oy + el.y * s, el.w * s, el.h * s);
    }
  });
  ctx.globalAlpha = 1;
}

/* --------------- Properties Panel --------------- */
function updateProps() {

    $('prop-minh').value = el.minH || 0;

function bindProps() {
  var map = [
    { id: 'prop-x', prop: 'x', parse: function(v) { return parseInt(v) || 0; } },
    { id: 'prop-y', prop: 'y', parse: function(v) { return parseInt(v) || 0; } },
    { id: 'prop-w', prop: 'w', parse: function(v) { return parseInt(v) || 10; } },
    { id: 'prop-h', prop: 'h', parse: function(v) { return parseInt(v) || 10; } },
    { id: 'prop-fill', prop: 'fill', sync: 'prop-tb-fill' },
    { id: 'prop-fillOpacity', prop: 'fillOpacity', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-tb-fillOpacity' },
    { id: 'prop-stroke', prop: 'stroke', sync: 'prop-tb-stroke' },
    { id: 'prop-strokeOpacity', prop: 'strokeOpacity', parse: function(v) { return parseInt(v) || 0; } },
    { id: 'prop-sw', prop: 'strokeWidth', parse: function(v) { return parseFloat(v) || 0; }, sync: 'prop-tb-sw' },
    { id: 'prop-opacity', prop: 'opacity', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-tb-opacity' },
    { id: 'prop-radius', prop: 'radius', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-tb-radius' },
    { id: 'prop-rot', prop: 'rotation', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-tb-rot' },
    { id: 'prop-tb-rot', prop: 'rotation', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-rot' },
    /* Text box style (mirrors general style — same data fields) */
    { id: 'prop-tb-fill', prop: 'fill', sync: 'prop-fill' },
    { id: 'prop-tb-fillOpacity', prop: 'fillOpacity', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-fillOpacity' },
    { id: 'prop-tb-stroke', prop: 'stroke', sync: 'prop-stroke' },
    { id: 'prop-tb-sw', prop: 'strokeWidth', parse: function(v) { return parseFloat(v) || 0; }, sync: 'prop-sw' },
    { id: 'prop-tb-opacity', prop: 'opacity', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-opacity' },
    { id: 'prop-tb-radius', prop: 'radius', parse: function(v) { return parseInt(v) || 0; }, sync: 'prop-radius' }
  ];

  map.forEach(function(m) {
    var el = $(m.id);
    if (!el) return;
    el.addEventListener('input', function() {
      var v = m.parse ? m.parse(this.value) : this.value;
      if (m.sync) {
        var s = $(m.sync);
        if (s) s.value = v;
      }
      var patch = {};
      patch[m.prop] = v;
      state.selectedElements.forEach(function(id) { updEl(id, patch); });
      updateProps();
    });
  });

  var tc = $('prop-text-content');
  if (tc) {
    var textEditTimer = null;
    var savedRange = null;

    /* Persist selection before user clicks toolbar controls */
    tc.addEventListener('mouseup', function() {
      var sel = window.getSelection();
      if (sel.rangeCount && sel.toString()) savedRange = sel.getRangeAt(0).cloneRange();
      else savedRange = null;
    });
    tc.addEventListener('keyup', function() {
      var sel = window.getSelection();
      if (sel.rangeCount && sel.toString()) savedRange = sel.getRangeAt(0).cloneRange();
      else savedRange = null;
    });

    /* Input: sync rich text to data model and canvas DOM directly — no full page rebuild */
    tc.addEventListener('input', function() {
      var val = this.innerHTML;
      var plain = val.replace(/<[^>]*>/g, '');
      state.selectedElements.forEach(function(id) {
        var d = getEl(id);
        if (d) { d.el.text = plain; d.el.richText = val; }
        var dom = document.querySelector('.canvas-element[data-id="' + id + '"]');
        if (dom) dom.innerHTML = val;
      });
      clearTimeout(textEditTimer);
      textEditTimer = setTimeout(function() { saveSnapshot(); }, 800);
    });
    tc.addEventListener('blur', function() {
      clearTimeout(textEditTimer);
      saveSnapshot();
    });
  }

  var selMap = {
    'prop-ff': 'fontFamily',
    'prop-fw': 'fontWeight',
    'prop-ta': 'textAlign'
  };
  Object.keys(selMap).forEach(function(id) {
    var el = $(id);
    if (!el) return;
    var prop = selMap[id];
    el.addEventListener('change', function() {
      if (!applyInlineFormat(id, this.value)) {
        var patch = {};
        patch[prop] = this.value;
        state.selectedElements.forEach(function(ix) { updEl(ix, patch); });
      }
    });
  });

  var fs = $('prop-fs');
  if (fs) {
    fs.addEventListener('input', function() {
      var val = parseInt(this.value) || 16;
      if (!applyInlineFormat('prop-fs', val)) {
        state.selectedElements.forEach(function(id) { updEl(id, { fontSize: val }); });
      }
    });
  }

  var tcl = $('prop-tc');
  if (tcl) {
    tcl.addEventListener('input', function() {
      var val = this.value;
      if (!applyInlineFormat('prop-tc', val)) {
        state.selectedElements.forEach(function(id) { updEl(id, { textColor: val }); });
      }
    });
  }

  /* Returns true if inline format was applied to a selection, false if no selection */
  function applyInlineFormat(field, value) {
    var tc = $('prop-text-content');
    if (!tc || !savedRange) return false;
    tc.focus();
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
    if (field === 'prop-ff') {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('fontName', false, value);
    } else if (field === 'prop-fs') {
      var wrap = document.createElement('span');
      wrap.style.fontSize = value + 'px';
      wrapRangeContents(savedRange, wrap);
    } else if (field === 'prop-fw') {
      var wrap = document.createElement('span');
      wrap.style.fontWeight = value;
      wrapRangeContents(savedRange, wrap);
    } else if (field === 'prop-tc') {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('foreColor', false, value);
    }
    tc.normalize();
    /* Save to data model and canvas directly — no full refresh */
    var val = tc.innerHTML;
    var plain = val.replace(/<[^>]*>/g, '');
    state.selectedElements.forEach(function(id) {
      var d = getEl(id);
      if (d) { d.el.text = plain; d.el.richText = val; }
      var dom = document.querySelector('.canvas-element[data-id="' + id + '"]');
      if (dom) dom.innerHTML = val;
    });
    saveSnapshot();
    /* Restore selection for continued editing */
    savedRange = sel.getRangeAt(0).cloneRange();
    return true;
  }

  /* Robust range wrapping: handles cross-element selections */
  function wrapRangeContents(range, wrapper) {
    try {
      range.surroundContents(wrapper);
    } catch (e) {
      /* Fallback: extract then wrap */
      var frag = range.extractContents();
      wrapper.appendChild(frag);
      range.insertNode(wrapper);
    }
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /* New spacing bindings */
  [{ id: 'prop-lh', prop: 'lineHeight' },
   { id: 'prop-ls', prop: 'letterSpacing' },
   { id: 'prop-pad', prop: 'padding' },
   { id: 'prop-ps', prop: 'paraSpacing' },
   { id: 'prop-ti', prop: 'textIndent' },
   { id: 'prop-cc', prop: 'columnCount' },
   { id: 'prop-cg', prop: 'columnGap' },
   { id: 'prop-minh', prop: 'minH' },
   { id: 'prop-maxh', prop: 'maxH' }].forEach(function(m) {
    var el = $(m.id);
    if (!el) return;
    el.addEventListener('input', function() {
      var v = parseFloat(this.value); if (isNaN(v)) v = (m.prop === 'lineHeight' ? 1.5 : m.prop === 'padding' ? 8 : m.prop === 'columnGap' ? 20 : m.prop === 'columnCount' ? 1 : 0);
      var patch = {};
      patch[m.prop] = v;
      state.selectedElements.forEach(function(id) { updEl(id, patch); });
    });
  });

  /* Select-based text bindings */
  [{ id: 'prop-va', prop: 'verticalAlign' },
   { id: 'prop-ov', prop: 'overflow' },
   { id: 'prop-dir', prop: 'dir' }].forEach(function(m) {
    var el = $(m.id);
    if (!el) return;
    el.addEventListener('change', function() {
      var patch = {};
      patch[m.prop] = this.value;
      state.selectedElements.forEach(function(id) { updEl(id, patch); });
    });
  });

  /* Auto-resize checkbox */
  var ar = $('prop-ar');
  if (ar) {
    ar.addEventListener('change', function() {
      var val = this.checked;
      state.selectedElements.forEach(function(id) { updEl(id, { autoResize: val }); });
      var ex = $('prop-ar-extra'); if (ex) ex.style.display = val ? 'flex' : 'none';
      if (val) refresh();
    });
  }

  /* Drop cap & hyphens checkboxes */
  [{ id: 'prop-dc', prop: 'dropCap' }, { id: 'prop-hy', prop: 'hyphens' }].forEach(function(m) {
    var cb = $(m.id);
    if (!cb) return;
    cb.addEventListener('change', function() {
      var val = this.checked;
      var p = {}; p[m.prop] = val;
      state.selectedElements.forEach(function(id) { updEl(id, p); });
    });
  });

  var imb = $('prop-image-btn');
  if (imb) {
    imb.addEventListener('click', function() {
      var f = $('image-file-input');
      if (f) f.click();
    });
  }

  var imf = $('image-file-input');
  if (imf) {
    imf.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        var r = new FileReader();
        r.onload = function(e) {
          state.selectedElements.forEach(function(id) { updEl(id, { src: e.target.result }); });
        };
        r.readAsDataURL(this.files[0]);
      }
      this.value = '';
    });
  }
}

      '\u00A7','\u00B6','\u2020','\u2021','\u02C6','\u0303','\u02D8','\u02D9','\u02DA','\u02DB',
      '\u2018','\u2019','\u201C','\u201D','\u2039','\u203A','\u00AB','\u00BB','\u201E','\u201A',
      '\u2660','\u2663','\u2665','\u2666','\u2605','\u2606','\u2713','\u2717','\u2192','\u2190',
      '\u2191','\u2193','\u21B5','\u2326','\u2302','\u2318','\u2325','\u2387','\u21E7','\u2303',
    ];
    charGrid.innerHTML = '';
    CHAR_LIST.forEach(function(ch) {
      var b = document.createElement('button');
      b.textContent = ch;
      b.addEventListener('mousedown', function(e) {
        e.preventDefault();
        tc.focus();
        document.execCommand('insertText', false, ch);
        charPopup.style.display = 'none';
      });
      charGrid.appendChild(b);
    });
    charBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var rect = charBtn.getBoundingClientRect();
      charPopup.style.display = 'block';
      charPopup.style.top = (rect.top - 10) + 'px';
      charPopup.style.left = (rect.left - 180) + 'px';
    });
    document.addEventListener('click', function(e) {
      if (!charPopup.contains(e.target) && e.target !== charBtn) {
        charPopup.style.display = 'none';
      }
    });
  }

  // Update button active state on selection change
  tc.addEventListener('keyup', updatePanelEditorButtons);
  tc.addEventListener('mouseup', updatePanelEditorButtons);

  function updatePanelEditorButtons() {
    var stateBtns = {
      'prop-bold-btn': 'bold',
      'prop-italic-btn': 'italic',
      'prop-underline-btn': 'underline',
      'prop-strikethrough-btn': 'strikeThrough',
      'prop-superscript-btn': 'superscript',
      'prop-subscript-btn': 'subscript'
    };
    Object.keys(stateBtns).forEach(function(id) {
      var btn = $(id);
      if (btn) {
        var active = document.queryCommandState(stateBtns[id]);
        btn.classList.toggle('active', active);
      }
    });
    /* Reflect current inline font/size/weight/color from selection */
    var tc = $('prop-text-content');
    if (!tc || document.activeElement !== tc) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var node = sel.getRangeAt(0).startContainer;
    if (!node) return;
    var el = node.nodeType === 3 ? node.parentElement : node;
    if (!el || !el.closest) return;
    var styles = window.getComputedStyle(el);
    var fontFam = el.closest('[style*="font-family"]');
    if (!fontFam) fontFam = el;
    var compFF = window.getComputedStyle(fontFam).fontFamily.replace(/['"]/g, '').split(',')[0].trim();
    var ff = $('prop-ff');
    if (ff && compFF) {
      for (var i = 0; i < ff.options.length; i++) {
        var ov = ff.options[i].value.replace(/['"]/g, '').split(',')[0].trim();
        if (ov === compFF) { ff.value = ff.options[i].value; break; }
      }
    }
    var fs = $('prop-fs');
    if (fs) {
      var sz = parseFloat(styles.fontSize);
      if (sz > 0) fs.value = Math.round(sz);
    }
    var fw = $('prop-fw');
    if (fw) {
      var w = parseInt(styles.fontWeight) || 400;
      fw.value = String(w);
    }
    var tcl = $('prop-tc');
    if (tcl) {
      var rgb = styles.color;
      if (rgb) tcl.value = rgbToHex(rgb);
    }
  }

  function rgbToHex(rgb) {
    var m = rgb.match(/\d+/g);
    if (!m) return '#000000';
    return '#' + m.slice(0,3).map(function(x) {
      var h = parseInt(x).toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  }
}

/* --------------- Find & Replace --------------- */
function openFindReplace() {
  $('find-replace-modal').style.display = 'flex';
  $('find-input').focus();
  $('find-status').textContent = '';
}
function closeFindReplace() {
  $('find-replace-modal').style.display = 'none';
}
function findTextElements() {
  var result = [];
  var p = cpage();
  if (!p) return result;
  p.elements.forEach(function(el) {
    if (el.type === 'text') result.push(el);
  });
  return result;
}
function findAndHighlight(forward) {
  var query = $('find-input').value;
  if (!query) { $('find-status').textContent = ''; return; }
  var els = findTextElements();
  var tc = $('prop-text-content');
  var sel = window.getSelection();
  var found = false;
  // Try editor first
  if (tc && tc.contains(document.activeElement)) {
    if (window.find) {
      found = window.find(query, false, !forward, true, false, false, false);
    }
  }
  if (found) { $('find-status').textContent = 'Found in editor'; return; }
  $('find-status').textContent = 'Not found';
}
function replaceOne() {
  var query = $('find-input').value;
  var rep = $('replace-input').value;
  if (!query) return;
  var tc = $('prop-text-content');
  if (tc && tc.contains(document.activeElement)) {
    var sel = window.getSelection();
    if (sel.rangeCount && sel.toString().toLowerCase() === query.toLowerCase()) {
      sel.deleteFromDocument();
      sel.getRangeAt(0).insertNode(document.createTextNode(rep));
      tc.dispatchEvent(new Event('input'));
    }
  }
  findAndHighlight(true);
}
function replaceAll() {
  var query = $('find-input').value;
  var rep = $('replace-input').value;
  if (!query) return;
  var count = 0;
  var p = cpage();
  if (!p) return;
  p.elements.forEach(function(el) {
    if (el.type !== 'text') return;
    if (!el.richText && !el.text) return;
    var html = el.richText || el.text;
    var re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    var newHtml = html.replace(re, function() { count++; return rep; });
    if (newHtml !== html) {
      el.richText = newHtml;
      el.text = newHtml.replace(/<[^>]*>/g, '');
    }
  });
  $('find-status').textContent = count + ' replacement(s)';
  saveSnapshot();
  emit();
}

function bindFindReplace() {
  $('find-close-btn').addEventListener('click', closeFindReplace);
  $('find-next-btn').addEventListener('click', function() { findAndHighlight(true); });
  $('find-prev-btn').addEventListener('click', function() { findAndHighlight(false); });
  $('replace-one-btn').addEventListener('click', replaceOne);
  $('replace-all-btn').addEventListener('click', replaceAll);
  $('find-replace-modal').addEventListener('click', function(e) {
    if (e.target === $('find-replace-modal')) closeFindReplace();
  });
}

  renderPage();
  applyAutoResize();
  renderPages();
  renderLayers();
  updateProps();
  updateStatusPage();
  updateCursor();

}

function updatePageDimensions() {
  var p = cpage();
  var pw = p ? (p.pw || PW) : PW;
  var ph = p ? (p.ph || PH) : PH;
  var root = document.documentElement;
  root.style.setProperty('--lp-pw', pw + 'px');
  root.style.setProperty('--lp-ph', ph + 'px');
  var ct = $('page-content');
  if (ct) ct.style.minHeight = ph + 'px';
}

function applyAutoResize() {
  var p = cpage();
  if (!p) return;
  p.elements.forEach(function(el) {
    if (el.type !== 'text' || !el.autoResize) return;
    var d = document.querySelector('.canvas-element[data-id="' + el.id + '"]');
    if (!d) return;
    var newH = d.scrollHeight;
    if (el.minH && newH < el.minH) newH = el.minH;
    if (el.maxH && newH > el.maxH) newH = el.maxH;
    if (newH !== el.h) { el.h = newH; d.style.height = newH + 'px'; }
  });
}

on(refresh);

/* --------------- Toolbar Bindings --------------- */
function bindToolbar() {

          s[id] = section.classList.contains('collapsed');
          localStorage.setItem('lp-collapsed-sections', JSON.stringify(s));
        } catch(e) {}

    });
  });

  try {
    var saved = JSON.parse(localStorage.getItem('lp-collapsed-sections') || '{}');
    document.querySelectorAll('.panel-section').forEach(function(sec) {
      var id = sec.id || Array.from(sec.parentNode.children).indexOf(sec);

  });

  $('btn-new').addEventListener('click', function() {
    var hasContent = state.pages.some(function(p) { return p.elements.length > 0; });
    if (hasContent && !confirm('Start a new project? Any unsaved changes will be lost.')) return;
    state.pages = [{ id: 'pg1', name: 'Page 1', elements: [], pw: PW, ph: PH }];
    state.currentPage = 'pg1';
    state.selectedElements = [];
    state.undoStack = [JSON.stringify(state.pages)];
    state.redoStack = [];
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;

    updatePageList();

    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.download = 'layout-project.json';
    a.href = URL.createObjectURL(blob);
    a.click();
    URL.revokeObjectURL(a.href);

  /* Import project from .json */
  $('btn-import').addEventListener('click', function() {

    input.type = 'file';

    input.onchange = function() {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var d = JSON.parse(e.target.result);
          if (d.pages) state.pages = d.pages;
          if (d.currentPage) state.currentPage = d.currentPage;
          if (typeof d.zoom === 'number') state.zoom = d.zoom;
          if (typeof d.panX === 'number') state.panX = d.panX;
          if (typeof d.panY === 'number') state.panY = d.panY;
          state.selectedElements = [];
          state.undoStack = [JSON.stringify(state.pages)];
          state.redoStack = [];
          /* Migrate pages missing dimensions */
          state.pages.forEach(function(pg) { if (!pg.pw) pg.pw = PW; if (!pg.ph) pg.ph = PH; });
          /* Ensure valid currentPage */
          if (!state.pages.some(function(p) { return p.id === state.currentPage; })) {
            state.currentPage = state.pages[0] ? state.pages[0].id : 'pg1';
          }
          applyTransform();
          refresh();
          updatePageList();
          showToast('Project imported');
        } catch(err) {

    state.selectedElements.slice().forEach(function(id) { removeElement(id); });
  });
  $('bring-front').addEventListener('click', function() {
    state.selectedElements.forEach(function(id) { bringForward(id); });
  });
  $('send-back').addEventListener('click', function() {

  });
  $('undo-btn').addEventListener('click', undo);
  $('redo-btn').addEventListener('click', redo);

  $('zoom-in').addEventListener('click', zoomIn);
  $('zoom-out').addEventListener('click', zoomOut);
  $('grid-toggle').addEventListener('click', function() {

  $('reset-view').addEventListener('click', function() {

    state.panY = 0;
    applyTransform();
  });

  $('add-page-btn').addEventListener('click', addPage);

  $('export-btn').addEventListener('click', function() {

  $('pdf-btn').addEventListener('click', function() {

/* --------------- Rulers --------------- */
function renderRulers() {
  var h = $('ruler-h');
  var v = $('ruler-v');
  if (!h || !v) return;
  h.innerHTML = '';
  v.innerHTML = '';
  var p = cpage();
  var pw = p ? (p.pw || PW) : PW, ph = p ? (p.ph || PH) : PH;
  var i;
  for (i = 0; i <= pw; i += GRID) {
    var m = document.createElement('div');
    m.className = 'ruler-mark';
    m.style.left = i + 'px';
    m.style.top = (i % 50 === 0 ? '12px' : '18px');
    m.style.width = '1px';
    m.style.height = (i % 50 === 0 ? '12px' : '6px');
    h.appendChild(m);
    if (i % 100 === 0) {
      var l = document.createElement('span');
      l.style.cssText = 'position:absolute;top:0;left:' + i + 'px;font-size:12px;color:var(--color-text-disabled);transform:translateX(-50%)';
      l.textContent = i;
      h.appendChild(l);
    }
  }
  for (i = 0; i <= ph; i += GRID) {
    var m2 = document.createElement('div');
    m2.className = 'ruler-mark';
    m2.style.top = i + 'px';
    m2.style.left = (i % 50 === 0 ? '12px' : '18px');
    m2.style.width = (i % 50 === 0 ? '12px' : '6px');
    m2.style.height = '1px';
    v.appendChild(m2);
    if (i % 100 === 0) {
      var l2 = document.createElement('span');
      l2.style.cssText = 'position:absolute;left:0;top:' + i + 'px;font-size:12px;color:var(--color-text-disabled);transform:translateY(-50%)';
      l2.textContent = i;
      v.appendChild(l2);
    }
  }
}
