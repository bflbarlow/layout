/* --------------- Hit Testing --------------- */
function hitTest(el, x, y) {
  /* For rotated elements, the AABB is a rough approximation.
     Use the DOM's elementFromPoint for accurate hit testing. */
  if (el.rotation) {
    var ct = $('page-content');
    if (!ct) return false;
    var rect = ct.getBoundingClientRect();
    var sx = rect.left + (el.x * state.zoom) + state.panX * state.zoom;
    var sy = rect.top + (el.y * state.zoom) + state.panY * state.zoom;
    return x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h;
  }
  return x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h;
}

function findEl(x, y) {
  var ct = $('page-content');
  if (!ct) return null;
  var els = ct.querySelectorAll('.canvas-element');
  for (var i = els.length - 1; i >= 0; i--) {
    var id = els[i].dataset.id;
    var d = getEl(id);
    if (d && d.el.visible && hitTest(d.el, x, y)) return { dom: els[i], data: d };
  }
  return null;
}

/* --------------- Interaction State --------------- */
var dragging = false, dragStart = null, dragOrig = null, dragIds = null;
var resizing = false, resizeDir = null, resizeOrig = null, resizeId = null, resizeStartPt = null;
var drawing = false, drawPt = null, drawGhost = null;

/* --------------- Tools --------------- */
var tNames = {
  select: 'Select Tool',
  text: 'Text Tool',
  line: 'Line Tool',
  image: 'Image Insert'
};

function updateCursor() {
  var pc = $('page-content');
  if (pc) pc.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
}

function updateStatus() {
  var el = $('status-tool');
  if (el) el.textContent = tNames[state.tool] || 'Select Tool';
}

function setTool(t) {
  state.tool = t;
  document.querySelectorAll('[data-tool]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tool === t);
  });
  updateCursor();
  updateStatus();
}

/* --------------- Pointer Events (unified mouse+touch) --------------- */
function onPointerDown(e) {
  var ct = $('page-content');
  if (!ct) return;

  /* Track pointer for pinch */
  state.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ptrCount = Object.keys(state.pointers).length;
  if (ptrCount >= 2) {
    dragging = false; resizing = false; drawing = false;
    if (drawGhost) { drawGhost.remove(); drawGhost = null; }
    var ptrs = Object.values(state.pointers);
    var dx = ptrs[1].x - ptrs[0].x;
    var dy = ptrs[1].y - ptrs[0].y;
    state.pinchStart = {
      dist: Math.sqrt(dx * dx + dy * dy),
      zoom: state.zoom, panX: state.panX, panY: state.panY,
      cx: (ptrs[0].x + ptrs[1].x) / 2, cy: (ptrs[0].y + ptrs[1].y) / 2
    };
    e.preventDefault();
    return;
  }

  if (e.button === 1) {
    state.isPanning = true;
    state.panStart = { x: e.clientX, y: e.clientY };
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;

  var handle = e.target.closest ? e.target.closest('.resize-handle') : null;
  if (handle) {
    e.stopPropagation(); e.preventDefault();
    resizing = true;
    resizeDir = handle.dataset.handle;
    var elDom = handle.closest('.canvas-element');
    if (!elDom) return;
    var id = elDom.dataset.id;
    var d = getEl(id);
    if (!d) return;
    resizeId = id;
    resizeStartPt = { x: e.clientX, y: e.clientY };
    resizeOrig = { x: d.el.x, y: d.el.y, w: d.el.w, h: d.el.h };
    return;
  }

  var pt = pageCoords(e);

  if (state.tool === 'text') {
    e.preventDefault();
    var el = addElement('text', { x: pt.x, y: pt.y, w: 200, h: 40, text: 'New Text' });
    select(el.id, false); setTool('select');
    return;
  }
  if (state.tool === 'image') {
    e.preventDefault();
    var inp = $('image-insert-input'); if (inp) inp.click();
    return;
  }
  if (state.tool === 'line') {
    e.preventDefault(); drawing = true; drawPt = pt; deselect();
    return;
  }

  var f = findEl(pt.x, pt.y);
  if (f) {
    var sid = f.data.el.id, sel = state.selectedElements;
    if (sel.indexOf(sid) !== -1) {
      if (sel.length === 1) {
        dragging = true; dragStart = pt;
        dragIds = sel.slice();
        dragOrig = sel.map(function(id2) { var dd = getEl(id2); return dd ? { x: dd.el.x, y: dd.el.y } : null; });
      }
    } else {
      select(sid, false); dragging = true; dragStart = pt;
      dragIds = state.selectedElements.slice();
      dragOrig = dragIds.map(function(id2) { var dd = getEl(id2); return dd ? { x: dd.el.x, y: dd.el.y } : null; });
    }
    showHandles(); return;
  }
  deselect(); hideHandles();
}

function onPointerMove(e) {
  var ct = $('page-content');
  if (!ct) return;
  state.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

  if (state.pinchStart && Object.keys(state.pointers).length >= 2) {
    var ptrs = Object.values(state.pointers);
    var dxP = ptrs[1].x - ptrs[0].x, dyP = ptrs[1].y - ptrs[0].y;
    var newDist = Math.sqrt(dxP * dxP + dyP * dyP);
    var scale = newDist / state.pinchStart.dist;
    var ccEl = $('canvas-container');
    var r = ccEl.getBoundingClientRect();
    var cx = (ptrs[0].x + ptrs[1].x) / 2 - r.left;
    var cy = (ptrs[0].y + ptrs[1].y) / 2 - r.top;
    var icx = state.pinchStart.cx - r.left;
    var icy = state.pinchStart.cy - r.top;
    var nz = Math.max(state.minZoom, Math.min(state.maxZoom, state.pinchStart.zoom * scale));
    var zFrac = nz / state.pinchStart.zoom;
    state.panX = icx - (icx - state.pinchStart.panX) * zFrac;
    state.panY = icy - (icy - state.pinchStart.panY) * zFrac;
    state.zoom = nz;
    state.panX += cx - icx;
    state.panY += cy - icy;
    applyTransform(); return;
  }

  if (state.isPanning) {
    state.panX += e.clientX - state.panStart.x;
    state.panY += e.clientY - state.panStart.y;
    state.panStart = { x: e.clientX, y: e.clientY };
    applyTransform(); return;
  }

  var pt = pageCoords(e);
  var posEl = $('status-pos');
  if (posEl) posEl.textContent = Math.round(pt.x) + ', ' + Math.round(pt.y);

  if (drawing && drawPt) {
    if (drawGhost) drawGhost.remove();
    var gh = document.createElement('div'); gh.className = 'selection-ghost';
    var x1 = Math.min(drawPt.x, pt.x), y1 = Math.min(drawPt.y, pt.y);
    var x2 = Math.max(drawPt.x, pt.x), y2 = Math.max(drawPt.y, pt.y);
    gh.style.left = x1 + 'px'; gh.style.top = y1 + 'px';
    gh.style.width = (x2 - x1) + 'px'; gh.style.height = (y2 - y1) + 'px';
    ct.appendChild(gh); drawGhost = gh;
  }

  if (dragging && dragIds) {
    var ddx = pt.x - dragStart.x, ddy = pt.y - dragStart.y;
    dragIds.forEach(function(id, i) {
      if (!dragOrig[i]) return;
      updEl(id, { x: snap(dragOrig[i].x + ddx), y: snap(dragOrig[i].y + ddy) });
    });
    var pe = $('page-content');
    if (pe) pe.querySelectorAll('.canvas-element').forEach(function(el) {
      if (dragIds.indexOf(el.dataset.id) !== -1) {
        var d = getEl(el.dataset.id);
        if (d) { el.style.left = d.el.x + 'px'; el.style.top = d.el.y + 'px'; }
      }
    });
  }

  if (resizing && resizeId) {
    var dxS = e.clientX - resizeStartPt.x, dyS = e.clientY - resizeStartPt.y;
    var r = resizeOrig, dir = resizeDir;
    var nx = r.x, ny = r.y, nw = r.w, nh = r.h;
    if (dir.indexOf('e') !== -1) nw = Math.max(10, r.w + dxS / state.zoom);
    if (dir.indexOf('w') !== -1) { nw = Math.max(10, r.w - dxS / state.zoom); nx = r.x + r.w - nw; }
    if (dir.indexOf('s') !== -1) nh = Math.max(10, r.h + dyS / state.zoom);
    if (dir.indexOf('n') !== -1) { nh = Math.max(10, r.h - dyS / state.zoom); ny = r.y + r.h - nh; }
    updEl(resizeId, { x: snap(nx), y: snap(ny), w: snap(nw), h: snap(nh) });
    var de = ct.querySelector('[data-id="' + resizeId + '"]');
    if (de) { de.style.left = snap(nx) + 'px'; de.style.top = snap(ny) + 'px';
              de.style.width = snap(nw) + 'px'; de.style.height = snap(nh) + 'px'; }
  }
}

function onPointerUp(e) {
  delete state.pointers[e.pointerId];
  if (state.pinchStart && Object.keys(state.pointers).length < 2) state.pinchStart = null;
  if (state.isPanning) { state.isPanning = false; return; }

  var wasDrag = dragging, wasResize = resizing;

  if (drawing && drawPt) {
    if (drawGhost) { drawGhost.remove(); drawGhost = null; }
    var pt = pageCoords(e);
    var x1 = Math.min(drawPt.x, pt.x), y1 = Math.min(drawPt.y, pt.y);
    var x2 = Math.max(drawPt.x, pt.x), y2 = Math.max(drawPt.y, pt.y);
    if (Math.abs(x2 - x1) > 3 || Math.abs(y2 - y1) > 3) {
      if (state.tool === 'line') {
        addElement('line', {
          x: x1, y: y1, x2: x2, y2: y2,
          w: Math.abs(x2 - x1), h: Math.abs(y2 - y1),
          stroke: '#111113', strokeWidth: 1
        });
      }
    }
    drawing = false; drawPt = null;
  }

  if (wasDrag || wasResize) { saveSnapshot(); emit(); }
  dragging = false; dragStart = null; dragIds = null; dragOrig = null;
  resizing = false; resizeId = null; resizeDir = null;
  resizeOrig = null; resizeStartPt = null;
}

function onPointerCancel(e) {
  delete state.pointers[e.pointerId];
  if (state.pinchStart && Object.keys(state.pointers).length < 2) state.pinchStart = null;
  state.isPanning = false; drawing = false; dragging = false; resizing = false;
  if (drawGhost) { drawGhost.remove(); drawGhost = null; }
}

function onWheel(e) {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    var d = e.deltaY > 0 ? -0.1 : 0.1;
    var nz = Math.max(state.minZoom, Math.min(state.maxZoom, state.zoom + d));
    var cb = e.currentTarget.getBoundingClientRect();
    state.panX = (e.clientX - cb.left) - ((e.clientX - cb.left) - state.panX) * (nz / state.zoom);
    state.panY = (e.clientY - cb.top) - ((e.clientY - cb.top) - state.panY) * (nz / state.zoom);
    state.zoom = nz;
    applyTransform();
  } else if (!state.pinchStart) {
    state.panX -= e.deltaX; state.panY -= e.deltaY;
    applyTransform();
  }
}

/* --------------- Keyboard --------------- */
function onKey(e) {
  var key = e.key.toLowerCase();
  var ctrl = e.ctrlKey || e.metaKey;

  if (ctrl && key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (ctrl && key === 'd') {
    e.preventDefault();
    state.selectedElements.forEach(function(id) { dupElement(id); });
    return;
  }
  if (ctrl && key === 'f') {
    e.preventDefault();
    openFindReplace();
    return;
  }
  if (ctrl && key === 'a') {
    var ae2 = document.activeElement;
    if (ae2 && (ae2.isContentEditable || ae2.tagName === 'INPUT' || ae2.tagName === 'TEXTAREA' || ae2.tagName === 'SELECT')) return;
    e.preventDefault();
    var p = cpage();
    if (p) {
      state.selectedElements = p.elements.map(function(el) { return el.id; });
      emit();
    }
    return;
  }
  if (key === 'delete' || key === 'backspace') {
    var ae = document.activeElement;
    if (ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
    if (state.selectedElements.length === 0) return;
    e.preventDefault();
    state.selectedElements.slice().forEach(function(id) { removeElement(id); });
    return;
  }
  if (key === 'escape') { deselect(); return; }

  if (!ctrl) {
    if (key === 'v') { setTool('select'); return; }
    if (key === 't') { setTool('text'); return; }
    if (key === 'l') { setTool('line'); return; }
  }

  /* Alignment shortcuts (Ctrl+Shift+L/C/R) when text editor is focused */
  if (ctrl && e.shiftKey) {
    var tc = $('prop-text-content');
    if (tc && document.activeElement === tc) {
      if (key === 'l') { e.preventDefault(); document.execCommand('justifyLeft', false, null); return; }
      if (key === 'c') { e.preventDefault(); document.execCommand('justifyCenter', false, null); return; }
      if (key === 'r') { e.preventDefault(); document.execCommand('justifyRight', false, null); return; }
    }
  }
}

/* --------------- Zoom --------------- */
function zoomIn() {
  state.zoom = Math.min(state.maxZoom, state.zoom + 0.25);
  applyTransform();
}

function zoomOut() {
  state.zoom = Math.max(state.minZoom, state.zoom - 0.25);
  applyTransform();
}

/* --------------- WIP Banner --------------- */
function dismissWip() {
  var banner = $('lp-wip-banner');
  if (banner) {
    banner.style.display = 'none';
    localStorage.setItem('lp-wip-dismissed', 'true');
  }
}

/* --------------- Image Insert --------------- */
function onImageInsert(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.match(/^image\//)) {
    showToast('Please select an image file.', 'error');
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    showToast('Image is too large. Maximum file size is 20MB.', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    var el = addElement('image', { src: ev.target.result, x: 100, y: 100, w: 300, h: 300 });
    select(el.id, false);
    setTool('select');
  };
  reader.onerror = function() {
    showToast('Failed to load image. The file may be corrupted.', 'error');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

/* --------------- Theme Toggle (STYLE_GUIDE §8.1) --------------- */
function bindThemeToggle() {
  var toggle = $('theme-toggle');
  if (!toggle) return;

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    toggle.setAttribute('aria-label',
      theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    toggle.innerHTML = theme === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }

  toggle.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!localStorage.getItem('theme')) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });

  var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(currentTheme);
}

/* --------------- Sidebar Resize & Collapse --------------- */
function bindSidebarResize() {
  var sidebar = $('sidebar-right');
  var handle = $('sidebar-resize-handle');
  var collapseBtn = $('btn-collapse-sidebar');
  if (!sidebar || !handle || !collapseBtn) return;

  /* ---- Collapse toggle ---- */
  function toggleSidebar() {
    var collapsed = sidebar.classList.toggle('collapsed');
    var svg = collapseBtn.querySelector('svg');
    if (collapsed) {
      collapseBtn.title = 'Expand sidebar';
      if (svg) svg.style.transform = 'scaleX(-1)';
      sidebar.style.width = '';
    } else {
      collapseBtn.title = 'Collapse sidebar';
      if (svg) svg.style.transform = '';
      var savedW = localStorage.getItem('lp-sidebar-width');
      if (savedW) {
        var w = parseInt(savedW, 10);
        if (w >= 120 && w <= 600) sidebar.style.width = w + 'px';
      }
    }
    localStorage.setItem('lp-sidebar-collapsed', collapsed ? '1' : '0');
  }

  collapseBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleSidebar();
  });

  /* Click collapsed header strip to expand */
  sidebar.addEventListener('click', function(e) {
    if (sidebar.classList.contains('collapsed') && e.target !== collapseBtn) {
      toggleSidebar();
    }
  });

  /* ---- Resize handle ---- */
  handle.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add('active');
    handle._startW = sidebar.offsetWidth;
    handle._startX = e.clientX;
  });

  document.addEventListener('pointermove', function(e) {
    if (!handle.classList.contains('active')) return;
    var dx = handle._startX - e.clientX;
    var newW = Math.max(120, Math.min(600, handle._startW + dx));
    sidebar.style.width = newW + 'px';
  });

  document.addEventListener('pointerup', function(e) {
    if (!handle.classList.contains('active')) return;
    handle.classList.remove('active');
    try { localStorage.setItem('lp-sidebar-width', String(sidebar.offsetWidth)); } catch (e) {}
  });
}

/* --------------- Init --------------- */
function init() {
  bindProps();
  bindPanelEditor();
  bindFindReplace();
  bindToolbar();
  bindThemeToggle();
  bindSidebarResize();

  /* WIP banner dismiss */
  var wipClose = $('lp-wip-close');
  if (wipClose) {
    wipClose.addEventListener('click', dismissWip);
    if (localStorage.getItem('lp-wip-dismissed') === 'true') {
      var banner = $('lp-wip-banner');
      if (banner) banner.style.display = 'none';
    }
  }

  var cc = $('canvas-container');
  if (cc) {
    cc.addEventListener('pointerdown', onPointerDown);
    cc.addEventListener('pointermove', onPointerMove);
    cc.addEventListener('pointerup', onPointerUp);
    cc.addEventListener('pointercancel', onPointerCancel);
    cc.addEventListener('wheel', onWheel, { passive: false });
  }

  document.addEventListener('keydown', onKey);

  /* Re-enable context menu on canvas for text editing */
  var cs = $('canvas-scroll');
  if (cs) {
    cs.addEventListener('contextmenu', function(e) {
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var textEl = el && el.closest ? el.closest('.el-text') : null;
      if (!textEl) { e.preventDefault(); return; }
      /* Let the browser show its native context menu for text */
    });
  }

  var iif = $('image-insert-input');
  if (iif) iif.addEventListener('change', onImageInsert);

  var saved = load();
  if (saved && saved.pages && saved.pages.length > 0) {
    state.pages = saved.pages;
    state.currentPageIndex = saved.idx || 0;
    if (state.currentPageIndex >= state.pages.length) state.currentPageIndex = 0;
    state.undoStack = [JSON.stringify(state.pages)];
    state.redoStack = [];
    state.selectedElements = [];
  } else {
    createDemo();
  }

  /* Restore zoom and pan */
  var savedZoom = localStorage.getItem('lp-zoom');
  if (savedZoom) {
    var z = parseFloat(savedZoom);
    if (z >= state.minZoom && z <= state.maxZoom) state.zoom = z;
  }
  var savedPanX = localStorage.getItem('lp-panX');
  if (savedPanX) state.panX = parseFloat(savedPanX) || 0;
  var savedPanY = localStorage.getItem('lp-panY');
  if (savedPanY) state.panY = parseFloat(savedPanY) || 0;
  /* Restore grid toggle */
  var showGrid = localStorage.getItem('lp-show-grid');
  if (showGrid === '0') {
    state.showGrid = false;
    var gg = $('grid-layer');
    if (gg) gg.style.display = 'none';
    var gt = $('grid-toggle');
    if (gt) gt.classList.remove('active');
  } else {
    var gtb = $('grid-toggle');
    if (gtb) gtb.classList.add('active');
  }
  refresh();

  /* Restore sidebar collapsed state and width */
  (function() {
    var sidebar = $('sidebar-right');
    var collapseBtn = $('btn-collapse-sidebar');
    if (!sidebar || !collapseBtn) return;

    if (localStorage.getItem('lp-sidebar-collapsed') === '1') {
      sidebar.classList.add('collapsed');
      collapseBtn.title = 'Expand sidebar';
      var svg = collapseBtn.querySelector('svg');
      if (svg) svg.style.transform = 'scaleX(-1)';
    }

    if (!sidebar.classList.contains('collapsed')) {
      var savedW = localStorage.getItem('lp-sidebar-width');
      if (savedW) {
        var w = parseInt(savedW, 10);
        if (w >= 120 && w <= 600) sidebar.style.width = w + 'px';
      }
    }
  })();
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
