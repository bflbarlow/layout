<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout — Page Layout Editor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%232563EB%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%2218%22%20height%3D%2218%22%20rx%3D%222%22%2F%3E%3Cline%20x1%3D%223%22%20y1%3D%2210%22%20x2%3D%2221%22%20y2%3D%2210%22%2F%3E%3Cline%20x1%3D%2212%22%20y1%3D%2210%22%20x2%3D%2212%22%20y2%3D%2221%22%2F%3E%3C%2Fsvg%3E">
<!-- No-flash theme detection (STYLE_GUIDE §8.1) -->
<script>
(function(){var s=localStorage.getItem('theme');var t=s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* ==========================================================================
   Ecosystem tokens (STYLE_GUIDE §2.2, §5.1, §6.1, §6.2)
   ========================================================================== */
:root {
  --color-accent:        #2563EB;
  --color-accent-hover:  #1D4ED8;
  --color-accent-soft:   #2563EB1A;

  --color-success: #16A34A;
  --color-warning: #D97706;
  --color-danger:  #DC2626;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "SFMono-Regular", Consolas, "Liberation Mono",
               Menlo, monospace;

  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.10);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.16);

  /* Tool-specific layout vars (prefixed --lp- to avoid collision) */
  --lp-toolbar-h: 52px;
  --lp-sidebar-w: 240px;
  --lp-statush: 28px;
  --lp-pw: 850px;
  --lp-ph: 1100px;
}

/* Light theme (default) */
:root,
[data-theme="light"] {
  --color-bg:            #FFFFFF;
  --color-bg-subtle:     #F5F5F7;
  --color-surface:       #FFFFFF;
  --color-border:        #E2E2E5;
  --color-text:          #111113;
  --color-text-muted:    #5B5B63;
  --color-text-disabled: #9A9AA1;
  --lp-bg-canvas:        #E8E8EC;
  --lp-bg-page:          #FFFFFF;
}

/* Dark theme */
[data-theme="dark"] {
  --color-bg:            #0E0E10;
  --color-bg-subtle:     #17171A;
  --color-surface:       #1C1C20;
  --color-border:        #2C2C32;
  --color-text:          #F2F2F3;
  --color-text-muted:    #A3A3AB;
  --color-text-disabled: #5B5B63;
  --lp-bg-canvas:        #252528;
  --lp-bg-page:          #FFFFFF;
}

/* Focus-visible (STYLE_GUIDE §8.4) */
:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Reduced motion (STYLE_GUIDE §9.4) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==========================================================================
   Global reset & base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-sans);font-size:var(--text-sm);background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ==========================================================================
   Skip link (STYLE_GUIDE §9.2)
   ========================================================================== */
.skip-link {
  position: absolute;
  top: -100%;
  left: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--color-accent);
  color: #FFFFFF;
  font-size: var(--text-sm);
  font-weight: 600;
  border-radius: var(--radius-sm);
  z-index: 200;
  text-decoration: none;
}
.skip-link:focus {
  top: var(--space-4);
}

/* ==========================================================================
   Toolbar / <header>
   ========================================================================== */
.toolbar{height:var(--lp-toolbar-h);background:var(--color-bg-subtle);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-3);gap:var(--space-1);z-index:100;flex-shrink:0}
.toolbar-group{display:flex;align-items:center;gap:var(--space-1)}
.toolbar-divider{width:1px;height:28px;background:var(--color-border);margin:0 var(--space-2)}

/* Tool buttons — 44×44px min touch target (STYLE_GUIDE §7.1) */
.tool-btn{
  display:flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;
  padding:var(--space-2);
  border:none;background:transparent;color:var(--color-text-muted);
  border-radius:var(--radius-sm);cursor:pointer;transition:all .15s
}
.tool-btn:hover{background:var(--color-border);color:var(--color-text)}
.tool-btn.active{background:var(--color-accent);color:#FFFFFF}
.tool-btn.primary{background:var(--color-accent);color:#FFFFFF;padding:var(--space-2) var(--space-4);width:auto;gap:var(--space-2);font-weight:500}
.tool-btn.primary:hover{background:var(--color-accent-hover)}
.tool-btn:disabled{color:var(--color-text-disabled);cursor:not-allowed;opacity:1}

/* Text toolbar */
.font-select{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);width:140px;min-height:44px}
.size-input{width:56px;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);text-align:center;min-height:44px;font-size:var(--text-base)}
.style-btn{min-width:44px;min-height:44px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 var(--space-1)}
.style-btn:hover{border-color:var(--color-accent);color:var(--color-accent)}
.style-btn.active{background:var(--color-accent-soft);border-color:var(--color-accent);color:var(--color-accent)}
.color-input{min-width:44px;min-height:44px;border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius-sm);cursor:pointer;padding:var(--space-1)}
.zoom-label{font-size:var(--text-xs);color:var(--color-text-muted);min-width:48px;text-align:center}

/* ==========================================================================
   Main layout
   ========================================================================== */
.main-layout{flex:1;display:flex;overflow:hidden;min-height:0}

/* ==========================================================================
   Sidebars
   ========================================================================== */
.sidebar{background:var(--color-bg-subtle);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-left{width:var(--lp-sidebar-w);border-right:1px solid var(--color-border)}
.sidebar-right{width:var(--lp-sidebar-w);border-left:1px solid var(--color-border)}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-border)}
.sidebar-header h3{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-disabled);font-weight:600}

/* Sidebar add page button — 44×44px touch target */
.sidebar-add-btn{
  min-width:44px;min-height:44px;
  border:1px solid var(--color-border);background:var(--color-surface);
  color:var(--color-text-muted);border-radius:var(--radius-sm);cursor:pointer;
  font-size:var(--text-lg);display:flex;align-items:center;justify-content:center
}
.sidebar-add-btn:hover{border-color:var(--color-accent);color:var(--color-accent)}

/* Page list & thumbnails */
.page-list{flex:1;overflow-y:auto;padding:var(--space-2)}
.page-thumb{background:var(--lp-bg-page);border:1px solid transparent;border-radius:var(--radius-sm);margin-bottom:var(--space-2);cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.page-thumb:hover{border-color:var(--color-border);box-shadow:var(--shadow-sm)}
.page-thumb.active{border-color:var(--color-accent)}
.page-thumb-canvas{width:100%;aspect-ratio:.7727;position:relative;background:#fff}
.page-thumb-label{padding:var(--space-1) var(--space-2);text-align:center;font-size:var(--text-xs);color:var(--color-text-disabled);background:var(--color-surface)}
.page-thumb .delete-page-btn{
  position:absolute;top:2px;right:2px;
  min-width:44px;min-height:44px;
  /* Visually smaller button padded to 44×44px touch target */
  width:24px;height:24px;
  background:var(--color-danger);color:#FFFFFF;
  border:none;border-radius:50%;
  font-size:14px;cursor:pointer;display:none;
  align-items:center;justify-content:center;line-height:1;
  /* Expand invisible hit area to 44×44px */
  padding:10px;
  background-clip:content-box;
}
.page-thumb:hover .delete-page-btn{display:flex}

/* Sidebar tabs */
.sidebar-tabs{display:flex;border-bottom:1px solid var(--color-border)}
.tab-btn{flex:1;padding:var(--space-2);border:none;background:transparent;color:var(--color-text-disabled);cursor:pointer;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:2px solid transparent;transition:all .15s;min-height:44px}
.tab-btn:hover{color:var(--color-text-muted)}
.tab-btn.active{color:var(--color-accent);border-bottom-color:var(--color-accent)}
.tab-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{display:none;flex:1;overflow-y:auto;padding:var(--space-3)}
.tab-panel.active{display:block}
.panel-section{margin-bottom:var(--space-4)}
.panel-section h4{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-disabled);margin-bottom:var(--space-2);font-weight:600}
.prop-row{display:flex;gap:var(--space-2);margin-bottom:var(--space-2);align-items:center}
.prop-row label{display:flex;align-items:center;gap:var(--space-1);flex:1;font-size:var(--text-xs);color:var(--color-text-muted)}
.prop-row label input,.prop-row label select,.prop-row label textarea{flex:1;background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:var(--text-base);min-height:44px}
.prop-row label input[type=color]{flex:0;min-width:44px;min-height:44px;cursor:pointer}
.prop-row label textarea{resize:vertical;font-family:inherit}
.prop-row label select{cursor:pointer}
.small-btn{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-muted);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-xs);min-height:44px}
.small-btn:hover{border-color:var(--color-accent);color:var(--color-accent)}

/* Layers panel */
.layer-list{display:flex;flex-direction:column;gap:var(--space-1)}
.layer-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-2);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--text-xs);color:var(--color-text-muted);transition:all .1s;min-height:44px}
.layer-item:hover{background:var(--color-border)}
.layer-item.active{background:var(--color-accent-soft);color:var(--color-accent)}
.layer-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.layer-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-visibility{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.4;border-radius:var(--radius-sm)}
.layer-visibility:hover{opacity:.8}
.layer-visibility.hidden{opacity:.2}

/* ==========================================================================
   Canvas area
   ========================================================================== */
.canvas-area{flex:1;overflow:hidden;background:var(--lp-bg-canvas);position:relative}
.canvas-scroll{width:100%;height:100%;overflow:auto;position:relative}
.canvas-container{position:relative;display:inline-block;padding:var(--space-7)}
.ruler-h{position:absolute;top:0;left:0;right:0;height:24px;background:var(--color-bg-subtle);border-bottom:1px solid var(--color-border);pointer-events:none}
.ruler-v{position:absolute;top:0;left:0;bottom:0;width:24px;background:var(--color-bg-subtle);border-right:1px solid var(--color-border);pointer-events:none}
.ruler-mark{position:absolute;background:var(--color-text-disabled)}
.canvas-page{width:var(--lp-pw);min-height:var(--lp-ph);background:var(--lp-bg-page);box-shadow:var(--shadow-md);position:relative;margin-left:24px;margin-top:24px}
.page-content{position:relative;width:100%;height:100%;min-height:var(--lp-ph)}
.canvas-element{position:absolute;cursor:move;border:1px solid transparent;transition:box-shadow .1s}
.canvas-element:hover{border-color:var(--color-accent-soft)}
.canvas-element.selected{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent)}
.resize-handle{position:absolute;width:10px;height:10px;background:var(--color-surface);border:1.5px solid var(--color-accent);border-radius:2px;z-index:10}
.resize-handle.nw{top:-5px;left:-5px;cursor:nw-resize}
.resize-handle.ne{top:-5px;right:-5px;cursor:ne-resize}
.resize-handle.sw{bottom:-5px;left:-5px;cursor:sw-resize}
.resize-handle.se{bottom:-5px;right:-5px;cursor:se-resize}
.resize-handle.n{top:-5px;left:50%;margin-left:-5px;cursor:n-resize}
.resize-handle.s{bottom:-5px;left:50%;margin-left:-5px;cursor:s-resize}
.resize-handle.w{top:50%;left:-5px;margin-top:-5px;cursor:w-resize}
.resize-handle.e{top:50%;right:-5px;margin-top:-5px;cursor:e-resize}
.el-text{padding:var(--space-2);white-space:pre-wrap;word-break:break-word;min-width:20px;min-height:20px}
.el-rect,.el-circle{overflow:hidden}
.el-image{overflow:hidden}
.el-image img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.selection-ghost{position:absolute;border:1.5px dashed var(--color-accent);pointer-events:none;z-index:50}

/* ==========================================================================
   Status bar
   ========================================================================== */
.status-bar{height:var(--lp-statush);background:var(--color-bg-subtle);border-top:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-3);font-size:var(--text-xs);color:var(--color-text-disabled);gap:var(--space-4);flex-shrink:0}
#status-tool{color:var(--color-accent);font-weight:500}

/* ==========================================================================
   Scrollbar styling
   ========================================================================== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--color-bg)}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:var(--radius-sm)}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-disabled)}

/* ==========================================================================
   WIP banner
   ========================================================================== */
.lp-wip-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-xs);
  color: var(--color-text);
  background: var(--color-warning);
  flex-shrink: 0;
}
.lp-wip-banner .lp-wip-close {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  padding: var(--space-1);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.8;
}
.lp-wip-banner .lp-wip-close:hover { opacity: 1; }

/* ==========================================================================
   Brand / About link in toolbar
   ========================================================================== */
.lp-brand {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-accent);
  padding: 0 var(--space-3);
  cursor: pointer;
  user-select: none;
  letter-spacing: -0.5px;
  white-space: nowrap;
  text-decoration: none;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: var(--space-1);
}
.lp-brand:hover {
  color: var(--color-accent-hover);
}

/* ==========================================================================
   Toast notification (STYLE_GUIDE §7.5)
   ========================================================================== */
.lp-toast-container {
  position: fixed;
  bottom: var(--space-5);
  right: var(--space-5);
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  pointer-events: none;
}
.lp-toast {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-sm);
  color: var(--color-text);
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  max-width: 360px;
  animation: lp-toast-in .2s ease;
}
.lp-toast.lp-toast-error {
  border-color: var(--color-danger);
}
.lp-toast .lp-toast-close {
  background: none;
  border: none;
  color: var(--color-text-disabled);
  cursor: pointer;
  padding: var(--space-1);
  min-width: 32px;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  margin-left: auto;
}
.lp-toast .lp-toast-close:hover {
  color: var(--color-text);
  background: var(--color-bg-subtle);
}
@keyframes lp-toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   Confirmation dialog (STYLE_GUIDE §7.5)
   ========================================================================== */
.lp-confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 400;
}
.lp-confirm-dialog {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  max-width: 400px;
  width: 90%;
  box-shadow: var(--shadow-lg);
}
.lp-confirm-dialog h3 {
  font-size: var(--text-base);
  font-weight: 600;
  margin-bottom: var(--space-2);
}
.lp-confirm-dialog p {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  margin-bottom: var(--space-4);
  line-height: 1.5;
}
.lp-confirm-actions {
  display: flex;
  gap: var(--space-2);
  justify-content: flex-end;
}
.lp-confirm-actions button {
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  cursor: pointer;
  min-height: 44px;
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-text);
}
.lp-confirm-actions .lp-confirm-delete {
  background: var(--color-danger);
  color: #FFFFFF;
  border-color: var(--color-danger);
}
.lp-confirm-actions .lp-confirm-delete:hover {
  opacity: .9;
}

/* ==========================================================================
   Spinner (STYLE_GUIDE §7.5)
   ========================================================================== */
.lp-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--color-border);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: lp-spin .6s linear infinite;
}
@keyframes lp-spin {
  to { transform: rotate(360deg); }
}

/* ==========================================================================
   Responsive (STYLE_GUIDE §9.6)
   ========================================================================== */
@media (max-width: 1100px) {
  :root { --lp-sidebar-w: 200px; }
}
@media (max-width: 800px) {
  .sidebar-left { display: none; }
  :root { --lp-sidebar-w: 180px; }
}
@media (max-width: 600px) {
  .sidebar-right { display: none; }
  .toolbar { flex-wrap: wrap; height: auto; min-height: var(--lp-toolbar-h); padding: var(--space-1) var(--space-2); gap: var(--space-1); }
}
@media (max-width: 480px) {
  .toolbar-group .tool-btn { min-width: 36px; min-height: 36px; padding: var(--space-1); }
  .font-select { width: 100px; }
}
</style>
</head>
<body>

<!-- Skip to main content (STYLE_GUIDE §9.2) -->
<a href="#canvas-area" class="skip-link">Skip to main content</a>

<!-- WIP banner -->
<div class="lp-wip-banner" id="lp-wip-banner">
  <span>⚠ This is a work in progress. Features are incomplete and will change.</span>
  <button class="lp-wip-close" id="lp-wip-close" aria-label="Dismiss warning"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
</div>

<!-- =========================================================================
     HEADER — Toolbar (STYLE_GUIDE §7.1, §8.1)
     ========================================================================= -->
<header class="toolbar" id="toolbar">
  <!-- Brand / About link -->

<!-- =========================================================================
     Toast container
     ========================================================================= -->
<div class="lp-toast-container" id="lp-toast-container" aria-live="polite"></div>

<script>
(function() {
'use strict';

/* ================================================================
   Layout — Page Layout Editor
   Single-file application JS
   ================================================================ */

var PW = 850, PH = 1100, GRID = 10, MAX_UNDO = 50, SAVE_DELAY = 1500, SK = 'layout-editor-data';
var $ = function(id) { return document.getElementById(id); };
var timer = null;

/* --------------- Toast system (STYLE_GUIDE §7.5) --------------- */
function showToast(message, type) {
  var container = $('lp-toast-container');
  if (!container) return;
  var t = document.createElement('div');
  t.className = 'lp-toast' + (type === 'error' ? ' lp-toast-error' : '');
  t.textContent = message;
  var close = document.createElement('button');
  close.className = 'lp-toast-close';
  close.setAttribute('aria-label', 'Dismiss notification');
  close.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  close.addEventListener('click', function() { t.remove(); });
  t.appendChild(close);
  container.appendChild(t);
  var timeout = setTimeout(function() { if (t.parentNode) t.remove(); }, 5000);
  t.addEventListener('mouseenter', function() { clearTimeout(timeout); });
  t.addEventListener('mouseleave', function() {
    timeout = setTimeout(function() { if (t.parentNode) t.remove(); }, 5000);
  });
  // Allow screen reader announcement via aria-live
}

/* --------------- Confirmation dialog (STYLE_GUIDE §7.5) --------------- */
function confirmDialog(message, confirmLabel, callback) {
  var overlay = document.createElement('div');
  overlay.className = 'lp-confirm-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-labelledby', 'confirm-title');

  overlay.innerHTML =
    '<div class="lp-confirm-dialog">' +
    '  <h3 id="confirm-title">' + message + '</h3>' +
    '  <p>This action cannot be undone.</p>' +
    '  <div class="lp-confirm-actions">' +
    '    <button class="lp-confirm-cancel" data-action="cancel">Cancel</button>' +
    '    <button class="lp-confirm-delete" data-action="confirm">' + confirmLabel + '</button>' +
    '  </div>' +
    '</div>';

  document.body.appendChild(overlay);

  // Focus management
  var firstBtn = overlay.querySelector('.lp-confirm-cancel');
  var lastBtn = overlay.querySelector('.lp-confirm-delete');
  if (firstBtn) firstBtn.focus();

  overlay.addEventListener('keydown', function trap(e) {
    if (e.key === 'Escape') { overlay.remove(); return; }
    if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === firstBtn) { e.preventDefault(); lastBtn.focus(); }
      else if (!e.shiftKey && document.activeElement === lastBtn) { e.preventDefault(); firstBtn.focus(); }
    }
  });

  overlay.querySelectorAll('button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      overlay.remove();
      if (this.dataset.action === 'confirm' && callback) callback();
    });
  });
}

/* --------------- State --------------- */
var state = {
  pages: [],
  currentPageIndex: 0,
  zoom: 100,
  tool: 'select',
  selectedElements: [],
  undoStack: [],
  redoStack: [],
  dirty: false
};

var subs = [];

function emit() {
  subs.forEach(function(f) { f(); });
}

function on(f) {
  subs.push(f);
}

function gid() {
  return 'e' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

function snap(v) {
  return Math.round(v / GRID) * GRID;
}

function cpage() {
  return state.pages[state.currentPageIndex];
}

function saveSnapshot() {
  state.undoStack.push(JSON.stringify(state.pages));
  if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
  state.redoStack = [];
  state.dirty = true;
}

/* --------------- Pages --------------- */
function mkPage(idx) {
  return {
    id: 'p' + Date.now().toString(36) + '_' + idx,
    elements: [],
    name: 'Page ' + (idx + 1)
  };
}

function addPage() {
  var i = state.pages.length;
  state.pages.push(mkPage(i));
  state.currentPageIndex = i;
  state.selectedElements = [];
  saveSnapshot();
  emit();
}

function removePage(idx) {
  if (state.pages.length <= 1) {
    showToast('Cannot delete the last page.', 'error');
    return;
  }
  confirmDialog('Delete this page?', 'Delete', function() {
    state.pages.splice(idx, 1);
    if (state.currentPageIndex >= state.pages.length) {
      state.currentPageIndex = state.pages.length - 1;
    }
    state.selectedElements = [];
    saveSnapshot();
    emit();
  });
}

function switchPage(idx) {
  if (idx >= 0 && idx < state.pages.length) {
    state.currentPageIndex = idx;
    state.selectedElements = [];
    emit();
  }
}

/* --------------- Elements --------------- */
function mkEl(type, opts) {
  var o = opts || {};
  var b = {
    id: gid(),
    type: type,
    x: o.x || 50,
    y: o.y || 50,
    w: o.w || 100,
    h: o.h || 100,
    fill: o.fill || (type === 'image' ? 'transparent' : '#FFFFFF'),
    stroke: o.stroke || '#111113',
    strokeWidth: o.strokeWidth != null ? o.strokeWidth : 1,
    opacity: o.opacity != null ? o.opacity : 100,
    radius: o.radius || (type === 'circle' ? 9999 : 0),
    visible: true,
    name: type.charAt(0).toUpperCase() + type.slice(1) + ' ' + Math.floor(Math.random() * 100)
  };
  if (type === 'text') {
    b.text = o.text || 'Text';
    b.fontFamily = o.fontFamily || 'Georgia, serif';
    b.fontSize = o.fontSize || 16;
    b.fontWeight = o.fontWeight || '400';
    b.textAlign = o.textAlign || 'left';
    b.textColor = o.textColor || '#111113';
  }
  if (type === 'image') b.src = o.src || '';
  if (type === 'line') {
    b.x2 = o.x2 || b.x + 100;
    b.y2 = o.y2 || b.y;
  }
  return b;
}

function addElement(type, opts) {
  var p = cpage();
  if (!p) return null;
  var el = mkEl(type, opts);
  p.elements.push(el);
  saveSnapshot();
  emit();
  return el;
}

function getEl(id) {
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        return { el: state.pages[i].elements[j], page: state.pages[i] };
      }
    }
  }
  return null;
}

function updEl(id, patch) {
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        for (var k in patch) {
          if (patch.hasOwnProperty(k)) {
            state.pages[i].elements[j][k] = patch[k];
          }
        }
        return true;
      }
    }
  }
  return false;
}

function removeElement(id) {
  var sel = state.selectedElements;
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        state.pages[i].elements.splice(j, 1);
        state.selectedElements = sel.filter(function(x) { return x !== id; });
        saveSnapshot();
        emit();
        return true;
      }
    }
  }
  return false;
}

function dupElement(id) {
  for (var i = 0; i < state.pages.length; i++) {
    for (var j = 0; j < state.pages[i].elements.length; j++) {
      if (state.pages[i].elements[j].id === id) {
        var clone = JSON.parse(JSON.stringify(state.pages[i].elements[j]));
        clone.id = gid();
        clone.x += 20;
        clone.y += 20;
        clone.name += ' copy';
        state.pages[i].elements.splice(j + 1, 0, clone);
        saveSnapshot();
        emit();
        return clone;
      }
    }
  }
  return null;
}

function bringForward(id) {
  for (var i = 0; i < state.pages.length; i++) {
    var es = state.pages[i].elements;
    for (var j = 0; j < es.length; j++) {
      if (es[j].id === id && j < es.length - 1) {
        es.push(es.splice(j, 1)[0]);
        saveSnapshot();
        emit();
        return true;
      }
    }
  }
  return false;
}

function sendBackward(id) {
  for (var i = 0; i < state.pages.length; i++) {
    var es = state.pages[i].elements;
    for (var j = 0; j < es.length; j++) {
      if (es[j].id === id && j > 0) {
        es.unshift(es.splice(j, 1)[0]);
        saveSnapshot();
        emit();
        return true;
      }
    }
  }
  return false;
}

function align(how) {
  var p = cpage();
  if (!p || state.selectedElements.length < 2) return;
  p.elements.forEach(function(el) {
    if (state.selectedElements.indexOf(el.id) === -1) return;
    if (how === 'left') {
      var minX = Infinity;
      state.selectedElements.forEach(function(id) {
        var found = null;
        for (var k = 0; k < p.elements.length; k++) {
          if (p.elements[k].id === id) { found = p.elements[k]; break; }
        }
        if (found) minX = Math.min(minX, found.x);
      });
      el.x = minX;
    } else if (how === 'center') {
      el.x = Math.round(PW / 2 - el.w / 2);
    } else if (how === 'right') {
      var maxX = 0;
      state.selectedElements.forEach(function(id) {
        var found = null;
        for (var k = 0; k < p.elements.length; k++) {
          if (p.elements[k].id === id) { found = p.elements[k]; break; }
        }
        if (found) maxX = Math.max(maxX, found.x + found.w);
      });
      el.x = maxX - el.w;
    }
  });
  saveSnapshot();
  emit();
}

function select(id, add) {
  if (add) {
    if (state.selectedElements.indexOf(id) === -1) state.selectedElements.push(id);
  } else {
    state.selectedElements = [id];
  }
  emit();
}

function deselect() {
  state.selectedElements = [];
  emit();
}

function undo() {
  if (state.undoStack.length <= 1) return;
  state.redoStack.push(state.undoStack.pop());
  state.pages = JSON.parse(state.undoStack[state.undoStack.length - 1]);
  state.selectedElements = [];
  emit();
}

function redo() {
  if (state.redoStack.length === 0) return;
  var next = state.redoStack.pop();
  state.undoStack.push(next);
  state.pages = JSON.parse(next);
  state.selectedElements = [];
  emit();
}

/* --------------- Persistence --------------- */
function save() {
  try {
    var d = { v: 1, ts: new Date().toISOString(), pages: state.pages, idx: state.currentPageIndex };
    localStorage.setItem(SK, JSON.stringify(d));
  } catch (e) {
    showToast('Could not save to local storage. Storage may be full.', 'error');
  }
}

function load() {
  try {
    var raw = localStorage.getItem(SK);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (d && d.pages && Array.isArray(d.pages)) return d;
    return null;
  } catch (e) {
    return null;
  }
}

function autosave() {
  if (!state.dirty) return;
  clearTimeout(timer);
  timer = setTimeout(function() {
    save();
    state.dirty = false;
  }, SAVE_DELAY);
}

/* --------------- Export --------------- */
function exportHTML() {
  var h = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n';
  h += 'body{margin:0;font-family:sans-serif;}\n';
  h += '.page{width:' + PW + 'px;height:' + PH + 'px;page-break-after:always;position:relative;background:white;overflow:hidden;}\n';
  h += '.page>*{position:absolute;}\n</style>\n</head>\n<body>\n';
  state.pages.forEach(function(pg) {
    h += '<div class="page">\n';
    pg.elements.forEach(function(el) {
      if (!el.visible) return;
      var s = 'left:' + el.x + 'px;top:' + el.y + 'px;width:' + el.w + 'px;height:' + el.h + 'px;';
      s += 'opacity:' + (el.opacity / 100) + ';border-radius:' + el.radius + 'px;';
      if (el.type === 'rect') {
        s += 'background:' + el.fill + ';border:' + el.strokeWidth + 'px solid ' + el.stroke + ';';
      } else if (el.type === 'circle') {
        s += 'background:' + el.fill + ';border:' + el.strokeWidth + 'px solid ' + el.stroke + ';border-radius:50%;';
      } else if (el.type === 'text') {
        s += 'color:' + el.textColor + ';font-family:' + el.fontFamily + ';font-size:' + el.fontSize + 'px;font-weight:' + el.fontWeight + ';text-align:' + el.textAlign + ';background:' + el.fill + ';';
      } else if (el.type === 'line') {
        s += 'width:' + (el.x2 - el.x) + 'px;border-top:' + el.strokeWidth + 'px solid ' + el.stroke + ';height:0;';
      }
      var extra = el.type === 'image' ? ' src="' + el.src + '"' : '';
      var inner = el.type === 'text' ? el.text : '';
      if (el.type === 'image') {
        h += '  <img style="' + s + '"' + extra + ' />\n';
      } else {
        h += '  <div style="' + s + '"' + extra + '>' + inner + '</div>\n';
      }
    });
    h += '</div>\n';
  });
  h += '</body>\n</html>';
  return h;
}

/* --------------- Canvas Renderer --------------- */
function renderPage() {
  var ct = $('page-content');
  if (!ct) return;
  ct.innerHTML = '';
  var p = cpage();
  if (!p) return;
  p.elements.forEach(function(el, i) {
    ct.appendChild(domEl(el, i));
  });
}

function domEl(el, i) {
  var d = document.createElement('div');
  d.className = 'canvas-element';
  if (el.type === 'text') d.classList.add('el-text');
  else if (el.type === 'rect') d.classList.add('el-rect');
  else if (el.type === 'circle') d.classList.add('el-circle');
  else if (el.type === 'image') d.classList.add('el-image');
  d.dataset.id = el.id;
  d.style.left = el.x + 'px';
  d.style.top = el.y + 'px';
  d.style.width = el.w + 'px';
  d.style.height = el.h + 'px';
  d.style.opacity = (el.opacity / 100);
  d.style.zIndex = i + 1;
  if (!el.visible) d.style.display = 'none';

  if (el.type === 'text') {
    d.textContent = el.text;
    d.style.fontFamily = el.fontFamily;
    d.style.fontSize = el.fontSize + 'px';
    d.style.fontWeight = el.fontWeight;
    d.style.textAlign = el.textAlign;
    d.style.color = el.textColor;
    d.style.background = el.fill;
    d.style.border = el.strokeWidth > 0 ? el.strokeWidth + 'px solid ' + el.stroke : 'none';
    d.style.borderRadius = el.radius + 'px';
  } else if (el.type === 'rect') {
    d.style.background = el.fill;
    d.style.border = el.strokeWidth > 0 ? el.strokeWidth + 'px solid ' + el.stroke : 'none';
    d.style.borderRadius = el.radius + 'px';
  } else if (el.type === 'circle') {
    d.style.background = el.fill;
    d.style.border = el.strokeWidth > 0 ? el.strokeWidth + 'px solid ' + el.stroke : 'none';
    d.style.borderRadius = '50%';
  } else if (el.type === 'line') {
    d.style.background = 'transparent';
    d.style.borderTop = el.strokeWidth + 'px solid ' + el.stroke;
    d.style.width = (el.x2 - el.x) + 'px';
    d.style.height = '0px';
    d.style.top = el.y + 'px';
  } else if (el.type === 'image') {
    d.style.background = el.fill;
    d.style.borderRadius = el.radius + 'px';
    if (el.src) {
      var img = document.createElement('img');
      img.src = el.src;
      img.draggable = false;
      img.alt = '';
      d.appendChild(img);
    }
  }
  return d;
}

function renderPages() {
  var list = $('page-list');
  if (!list) return;
  list.innerHTML = '';
  state.pages.forEach(function(pg, i) {
    var t = document.createElement('div');
    t.className = 'page-thumb' + (i === state.currentPageIndex ? ' active' : '');
    t.dataset.pi = i;
    t.setAttribute('role', 'listitem');
    t.setAttribute('tabindex', '0');
    t.setAttribute('aria-label', pg.name);

    var c = document.createElement('canvas');
    c.width = 212;
    c.height = 275;
    c.className = 'page-thumb-canvas';
    drawThumb(c, pg);
    t.appendChild(c);

    var lb = document.createElement('div');
    lb.className = 'page-thumb-label';
    lb.textContent = pg.name;
    t.appendChild(lb);

    var db = document.createElement('button');
    db.className = 'delete-page-btn';
    db.setAttribute('aria-label', 'Delete ' + pg.name);
    // SVG X icon instead of Unicode ×
    db.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    t.appendChild(db);

        switchPage(idx);
      });

      });

        e.stopPropagation();
        removePage(idx);
      });
    })(i);

    list.appendChild(t);
  });
  var ab = $('add-page-btn');
  if (ab) ab.style.display = state.pages.length >= 10 ? 'none' : 'flex';
}

function drawThumb(canvas, pg) {
  var ctx = canvas.getContext('2d');
  var s = canvas.width / PW;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  pg.elements.forEach(function(el) {
    if (!el.visible) return;
    ctx.globalAlpha = el.opacity / 100;
    if (el.type === 'text') {
      ctx.fillStyle = el.textColor;
      ctx.font = (el.fontSize * s) + 'px ' + el.fontFamily;
      ctx.fillText(el.text, el.x * s, el.y * s + el.fontSize * s * 0.8);
    } else if (el.type === 'rect' || el.type === 'circle') {
      ctx.fillStyle = el.fill;
      ctx.fillRect(el.x * s, el.y * s, el.w * s, el.h * s);
    } else if (el.type === 'line') {
      ctx.strokeStyle = el.stroke;
      ctx.lineWidth = el.strokeWidth;
      ctx.beginPath();
      ctx.moveTo(el.x * s, el.y * s);
      ctx.lineTo(el.x2 * s, el.y2 * s);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

/* --------------- Properties Panel --------------- */
function updateProps() {
  var sel = state.selectedElements;
  var ts = $('prop-text-section');
  var is = $('prop-image-section');
  var tss = $('prop-text-style-section');
  if (!ts) return;
  if (sel.length === 0) {
    ts.style.display = 'none';
    is.style.display = 'none';
    tss.style.display = 'none';
    return;
  }

  var d = getEl(sel[0]);
  if (!d) return;
  var el = d.el;

  if (el.type === 'text') {
    ts.style.display = 'block';
    tss.style.display = 'block';
    $('prop-text-content').value = el.text;
    $('prop-ff').value = el.fontFamily;
    $('prop-fs').value = el.fontSize;
    $('prop-fw').value = el.fontWeight;
    $('prop-ta').value = el.textAlign;
    $('prop-tc').value = el.textColor;
  } else {
    ts.style.display = 'none';
    tss.style.display = 'none';
  }

  is.style.display = el.type === 'image' ? 'block' : 'none';

  $('prop-x').value = Math.round(el.x);
  $('prop-y').value = Math.round(el.y);
  $('prop-w').value = Math.round(el.w);
  $('prop-h').value = Math.round(el.h);
  $('prop-fill').value = el.fill === 'transparent' ? '#FFFFFF' : el.fill;
  $('prop-stroke').value = el.stroke;
  $('prop-sw').value = el.strokeWidth;
  $('prop-opacity').value = el.opacity;
  $('prop-radius').value = el.radius;
}

function bindProps() {
  var map = [
    { id: 'prop-x', prop: 'x', parse: function(v) { return parseInt(v) || 0; } },
    { id: 'prop-y', prop: 'y', parse: function(v) { return parseInt(v) || 0; } },
    { id: 'prop-w', prop: 'w', parse: function(v) { return parseInt(v) || 10; } },
    { id: 'prop-h', prop: 'h', parse: function(v) { return parseInt(v) || 10; } },
    { id: 'prop-fill', prop: 'fill' },
    { id: 'prop-stroke', prop: 'stroke' },
    { id: 'prop-sw', prop: 'strokeWidth', parse: function(v) { return parseFloat(v) || 0; } },
    { id: 'prop-opacity', prop: 'opacity', parse: function(v) { return parseInt(v) || 0; } },
    { id: 'prop-radius', prop: 'radius', parse: function(v) { return parseInt(v) || 0; } }
  ];

  map.forEach(function(m) {
    var el = $(m.id);
    if (!el) return;
    el.addEventListener('input', function() {
      var v = m.parse ? m.parse(this.value) : this.value;
      var patch = {};
      patch[m.prop] = v;
      state.selectedElements.forEach(function(id) { updEl(id, patch); });
      updateProps();
    });
  });

  var tc = $('prop-text-content');
  if (tc) {
    tc.addEventListener('input', function() {
      var val = this.value;
      state.selectedElements.forEach(function(id) { updEl(id, { text: val }); });
    });
  }

  var selMap = {
    'prop-ff': 'fontFamily',
    'prop-fw': 'fontWeight',
    'prop-ta': 'textAlign'
  };
  Object.keys(selMap).forEach(function(id) {
    var el = $(id);
    if (!el) return;
    var prop = selMap[id];
    el.addEventListener('change', function() {
      var patch = {};
      patch[prop] = this.value;
      state.selectedElements.forEach(function(ix) { updEl(ix, patch); });
    });
  });

  var fs = $('prop-fs');
  if (fs) {
    fs.addEventListener('input', function() {
      var val = parseInt(this.value) || 16;
      state.selectedElements.forEach(function(id) { updEl(id, { fontSize: val }); });
    });
  }

  var tcl = $('prop-tc');
  if (tcl) {
    tcl.addEventListener('input', function() {
      var val = this.value;
      state.selectedElements.forEach(function(id) { updEl(id, { textColor: val }); });
    });
  }

  var imb = $('prop-image-btn');
  if (imb) {
    imb.addEventListener('click', function() {
      var f = $('image-file-input');
      if (f) f.click();
    });
  }

  var imf = $('image-file-input');
  if (imf) {
    imf.addEventListener('change', function() {
      if (this.files && this.files[0]) {
        var r = new FileReader();
        r.onload = function(e) {
          state.selectedElements.forEach(function(id) { updEl(id, { src: e.target.result }); });
        };
        r.readAsDataURL(this.files[0]);
      }
      this.value = '';
    });
  }
}

/* --------------- Rulers --------------- */
function renderRulers() {
  var h = $('ruler-h');
  var v = $('ruler-v');
  if (!h || !v) return;
  h.innerHTML = '';
  v.innerHTML = '';
  var i;
  for (i = 0; i <= PW; i += GRID) {
    var m = document.createElement('div');
    m.className = 'ruler-mark';
    m.style.left = (24 + i) + 'px';
    m.style.top = (i % 50 === 0 ? '12px' : '18px');
    m.style.width = '1px';
    m.style.height = (i % 50 === 0 ? '12px' : '6px');
    h.appendChild(m);
    if (i % 100 === 0 && i > 0) {
      var l = document.createElement('span');
      l.style.cssText = 'position:absolute;top:0;left:' + (22 + i) + 'px;font-size:12px;color:var(--color-text-disabled);transform:translateX(-50%)';
      l.textContent = i;
      h.appendChild(l);
    }
  }
  for (i = 0; i <= PH; i += GRID) {
    var m2 = document.createElement('div');
    m2.className = 'ruler-mark';
    m2.style.top = (24 + i) + 'px';
    m2.style.left = (i % 50 === 0 ? '12px' : '18px');
    m2.style.width = (i % 50 === 0 ? '12px' : '6px');
    m2.style.height = '1px';
    v.appendChild(m2);
    if (i % 100 === 0 && i > 0) {
      var l2 = document.createElement('span');
      l2.style.cssText = 'position:absolute;left:0;top:' + (22 + i) + 'px;font-size:12px;color:var(--color-text-disabled);transform:translateY(-50%)';
      l2.textContent = i;
      v.appendChild(l2);
    }
  }
}

/* --------------- Selection Handles --------------- */
function showHandles() {
  var ct = $('page-content');
  if (!ct) return;
  ct.querySelectorAll('.resize-handle').forEach(function(h) { h.remove(); });
  state.selectedElements.forEach(function(id) {
    var d = ct.querySelector('[data-id="' + id + '"]');
    if (!d) return;
    ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach(function(p) {
      var h = document.createElement('div');
      h.className = 'resize-handle ' + p;
      h.dataset.handle = p;
      d.appendChild(h);
    });
  });
  document.querySelectorAll('.canvas-element').forEach(function(el) {
    var isSel = state.selectedElements.indexOf(el.dataset.id) !== -1;
    el.classList.toggle('selected', isSel);
  });
}

function hideHandles() {
  var ct = $('page-content');
  if (ct) ct.querySelectorAll('.resize-handle').forEach(function(h) { h.remove(); });
}

/* --------------- Hit Testing --------------- */
function hitTest(el, x, y) {
  return x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h;
}

function pageCoords(e) {
  var ct = $('page-content');
  if (!ct) return { x: 0, y: 0 };
  var r = ct.getBoundingClientRect();
  var scroll = ct.parentElement;
  return {
    x: e.clientX - r.left + scroll.scrollLeft,
    y: e.clientY - r.top + scroll.scrollTop
  };
}

function findEl(x, y) {
  var ct = $('page-content');
  if (!ct) return null;
  var els = ct.querySelectorAll('.canvas-element');
  for (var i = els.length - 1; i >= 0; i--) {
    var id = els[i].dataset.id;
    var d = getEl(id);
    if (d && d.el.visible && hitTest(d.el, x, y)) return { dom: els[i], data: d };
  }
  return null;
}

/* --------------- Interaction State --------------- */
var dragging = false, dragStart = null, dragOrig = null, dragIds = null;
var resizing = false, resizeDir = null, resizeOrig = null, resizeId = null, resizeStartPt = null;
var drawing = false, drawPt = null, drawGhost = null;

/* --------------- Tools --------------- */
var tNames = {
  select: 'Select Tool',
  text: 'Text Tool',
  rect: 'Rectangle Tool',
  circle: 'Circle Tool',
  line: 'Line Tool',
  image: 'Image Insert'
};

function updateCursor() {
  var pc = $('page-content');
  if (pc) pc.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
}

function updateToolbar() {
  var tt = $('text-tools');
  var fs = $('fill-stroke-tools');
  if (tt) tt.style.display = state.tool === 'text' ? 'flex' : 'none';
  if (fs) fs.style.display = (state.tool === 'rect' || state.tool === 'circle' || state.tool === 'line') ? 'flex' : 'none';
}

function updateStatus() {
  var el = $('status-tool');
  if (el) el.textContent = tNames[state.tool] || 'Select Tool';
}

function setTool(t) {
  state.tool = t;
  document.querySelectorAll('[data-tool]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tool === t);
  });
  updateCursor();
  updateToolbar();
  updateStatus();
}

/* --------------- Mouse Events --------------- */
function onDown(e) {
  var ct = $('page-content');
  if (!ct) return;

  /* Resize handle? */
  var handle = null;
  if (e.target.closest) handle = e.target.closest('.resize-handle');
  if (handle) {
    e.stopPropagation();
    resizing = true;
    resizeDir = handle.dataset.handle;
    var elDom = handle.closest('.canvas-element');
    if (!elDom) return;
    var id = elDom.dataset.id;
    var d = getEl(id);
    if (!d) return;
    resizeId = id;
    resizeStartPt = { x: e.clientX, y: e.clientY };
    resizeOrig = { x: d.el.x, y: d.el.y, w: d.el.w, h: d.el.h };
    return;
  }

  var pt = pageCoords(e);

  if (state.tool === 'text') {
    var el = addElement('text', { x: pt.x, y: pt.y, w: 200, h: 40, text: 'New Text' });
    select(el.id, false);
    setTool('select');
    return;
  }

  if (state.tool === 'image') {
    var inp = $('image-insert-input');
    if (inp) inp.click();
    return;
  }

  if (state.tool === 'rect' || state.tool === 'circle' || state.tool === 'line') {
    drawing = true;
    drawPt = pt;
    deselect();
    return;
  }

  /* Select tool */
  var f = findEl(pt.x, pt.y);
  if (f) {
    var sid = f.data.el.id;
    var sel = state.selectedElements;
    if (sel.indexOf(sid) !== -1) {
      if (sel.length === 1) {
        dragging = true;
        dragStart = pt;
        dragIds = sel.slice();
        dragOrig = sel.map(function(id) {
          var dd = getEl(id);
          return dd ? { x: dd.el.x, y: dd.el.y } : null;
        });
      }
    } else {
      select(sid, true);
      dragging = true;
      dragStart = pt;
      dragIds = state.selectedElements.slice();
      dragOrig = dragIds.map(function(id) {
        var dd = getEl(id);
        return dd ? { x: dd.el.x, y: dd.el.y } : null;
      });
    }
    showHandles();
    return;
  }

  deselect();
  hideHandles();
}

function onMove(e) {
  var ct = $('page-content');
  if (!ct) return;
  var pt = pageCoords(e);
  var posEl = $('status-pos');
  if (posEl) posEl.textContent = Math.round(pt.x) + ', ' + Math.round(pt.y);

  /* Draw ghost */
  if (drawing && drawPt) {
    if (drawGhost) drawGhost.remove();
    var gh = document.createElement('div');
    gh.className = 'selection-ghost';
    var x1 = Math.min(drawPt.x, pt.x);
    var y1 = Math.min(drawPt.y, pt.y);
    var x2 = Math.max(drawPt.x, pt.x);
    var y2 = Math.max(drawPt.y, pt.y);
    gh.style.left = x1 + 'px';
    gh.style.top = y1 + 'px';
    gh.style.width = (x2 - x1) + 'px';
    gh.style.height = (y2 - y1) + 'px';
    ct.appendChild(gh);
    drawGhost = gh;
  }

  /* Drag */
  if (dragging && dragIds) {
    var dx = pt.x - dragStart.x;
    var dy = pt.y - dragStart.y;
    dragIds.forEach(function(id, i) {
      if (!dragOrig[i]) return;
      updEl(id, { x: snap(dragOrig[i].x + dx), y: snap(dragOrig[i].y + dy) });
    });
    var pe = $('page-content');
    if (pe) {
      pe.querySelectorAll('.canvas-element').forEach(function(el) {
        if (dragIds.indexOf(el.dataset.id) !== -1) {
          var d = getEl(el.dataset.id);
          if (d) {
            el.style.left = d.el.x + 'px';
            el.style.top = d.el.y + 'px';
          }
        }
      });
    }
  }

  /* Resize */
  if (resizing && resizeId) {
    var dx2 = pt.x - resizeStartPt.x;
    var dy2 = pt.y - resizeStartPt.y;
    var r = resizeOrig;
    var dir = resizeDir;
    var nx = r.x, ny = r.y, nw = r.w, nh = r.h;
    if (dir.indexOf('e') !== -1) nw = Math.max(10, r.w + dx2);
    if (dir.indexOf('w') !== -1) { nw = Math.max(10, r.w - dx2); nx = r.x + r.w - nw; }
    if (dir.indexOf('s') !== -1) nh = Math.max(10, r.h + dy2);
    if (dir.indexOf('n') !== -1) { nh = Math.max(10, r.h - dy2); ny = r.y + r.h - nh; }
    updEl(resizeId, { x: snap(nx), y: snap(ny), w: snap(nw), h: snap(nh) });
    var de = ct.querySelector('[data-id="' + resizeId + '"]');
    if (de) {
      de.style.left = snap(nx) + 'px';
      de.style.top = snap(ny) + 'px';
      de.style.width = snap(nw) + 'px';
      de.style.height = snap(nh) + 'px';
    }
  }
}

/* --------------- Mouse Up --------------- */
function onUp(e) {
  var wasDrag = dragging;
  var wasResize = resizing;

  if (drawing && drawPt) {
    if (drawGhost) { drawGhost.remove(); drawGhost = null; }
    var pt = pageCoords(e);
    var x1 = Math.min(drawPt.x, pt.x);
    var y1 = Math.min(drawPt.y, pt.y);
    var x2 = Math.max(drawPt.x, pt.x);
    var y2 = Math.max(drawPt.y, pt.y);
    if (Math.abs(x2 - x1) > 3 || Math.abs(y2 - y1) > 3) {
      if (state.tool === 'line') {
        addElement('line', {
          x: x1, y: y1, x2: x2, y2: y2,
          w: Math.abs(x2 - x1), h: Math.abs(y2 - y1),
          stroke: $('stroke-color').value,
          strokeWidth: parseInt($('stroke-width').value) || 1
        });
      } else if (state.tool === 'rect') {
        addElement('rect', {
          x: x1, y: y1, w: x2 - x1, h: y2 - y1,
          fill: $('fill-color').value,
          stroke: $('stroke-color').value,
          strokeWidth: parseInt($('stroke-width').value) || 1
        });
      } else if (state.tool === 'circle') {
        addElement('circle', {
          x: x1, y: y1, w: x2 - x1, h: y2 - y1,
          fill: $('fill-color').value,
          stroke: $('stroke-color').value,
          strokeWidth: parseInt($('stroke-width').value) || 1
        });
      }
    }
    drawing = false;
    drawPt = null;
  }

  if (wasDrag || wasResize) {
    saveSnapshot();
    emit();
  }
  dragging = false;
  dragStart = null;
  dragIds = null;
  dragOrig = null;
  resizing = false;
  resizeId = null;
  resizeDir = null;
  resizeOrig = null;
  resizeStartPt = null;
}

/* --------------- Keyboard --------------- */
function onKey(e) {
  var key = e.key.toLowerCase();
  var ctrl = e.ctrlKey || e.metaKey;

  if (ctrl && key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (ctrl && key === 'd') {
    e.preventDefault();
    state.selectedElements.forEach(function(id) { dupElement(id); });
    return;
  }
  if (ctrl && key === 'a') {
    e.preventDefault();
    var p = cpage();
    if (p) {
      state.selectedElements = p.elements.map(function(el) { return el.id; });
      emit();
    }
    return;
  }
  if (key === 'delete' || key === 'backspace') {
    if (state.selectedElements.length === 0) return;
    e.preventDefault();
    confirmDialog('Delete ' + state.selectedElements.length + ' selected element' + (state.selectedElements.length > 1 ? 's' : '') + '?', 'Delete', function() {
      state.selectedElements.slice().forEach(function(id) { removeElement(id); });
    });
    return;
  }
  if (key === 'escape') { deselect(); return; }

  if (!ctrl) {
    if (key === 'v') { setTool('select'); return; }
    if (key === 't') { setTool('text'); return; }
    if (key === 'r') { setTool('rect'); return; }
    if (key === 'c') { setTool('circle'); return; }
    if (key === 'l') { setTool('line'); return; }
  }
}

/* --------------- Zoom --------------- */
function zoomIn() {
  state.zoom = Math.min(400, state.zoom + 25);
  $('zoom-label').textContent = state.zoom + '%';
  var pc = $('canvas-page');
  if (pc) {
    pc.style.transform = 'scale(' + (state.zoom / 100) + ')';
    pc.style.transformOrigin = 'top left';
  }
}

function zoomOut() {
  state.zoom = Math.max(25, state.zoom - 25);
  $('zoom-label').textContent = state.zoom + '%';
  var pc = $('canvas-page');
  if (pc) {
    pc.style.transform = 'scale(' + (state.zoom / 100) + ')';
    pc.style.transformOrigin = 'top left';
  }
}

/* --------------- WIP Banner --------------- */
function dismissWip() {
  var banner = $('lp-wip-banner');
  if (banner) {
    banner.style.display = 'none';
    localStorage.setItem('lp-wip-dismissed', 'true');
  }
}

/* --------------- Image Insert --------------- */
function onImageInsert(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.match(/^image\//)) {
    showToast('Please select an image file.', 'error');
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    showToast('Image is too large. Maximum file size is 20MB.', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    var el = addElement('image', { src: ev.target.result, x: 100, y: 100, w: 300, h: 300 });
    select(el.id, false);
    setTool('select');
  };
  reader.onerror = function() {
    showToast('Failed to load image. The file may be corrupted.', 'error');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

/* --------------- Theme Toggle (STYLE_GUIDE §8.1) --------------- */
function bindThemeToggle() {
  var toggle = $('theme-toggle');
  if (!toggle) return;

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    toggle.setAttribute('aria-label',
      theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    toggle.innerHTML = theme === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }

  toggle.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!localStorage.getItem('theme')) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });

  var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(currentTheme);
}

/* --------------- Init --------------- */
function init() {
  bindProps();
  bindToolbar();
  bindTextTools();
  bindThemeToggle();

  /* WIP banner dismiss */
  var wipClose = $('lp-wip-close');
  if (wipClose) {
    wipClose.addEventListener('click', dismissWip);
    if (localStorage.getItem('lp-wip-dismissed') === 'true') {
      var banner = $('lp-wip-banner');
      if (banner) banner.style.display = 'none';
    }
  }

  var pc = $('page-content');
  if (pc) {
    pc.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  document.addEventListener('keydown', onKey);

  var iif = $('image-insert-input');
  if (iif) iif.addEventListener('change', onImageInsert);

  var saved = load();
  if (saved && saved.pages && saved.pages.length > 0) {
    state.pages = saved.pages;
    state.currentPageIndex = saved.idx || 0;
    if (state.currentPageIndex >= state.pages.length) state.currentPageIndex = 0;
    state.undoStack = [JSON.stringify(state.pages)];
    state.redoStack = [];
    state.selectedElements = [];
  } else {
    createDemo();
  }
  refresh();
}

document.addEventListener('DOMContentLoaded', init);

})();
